<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Study Reviewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.7.570/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--panel2:#f8fafc;--text:#182230;--muted:#667085;
  --line:#d9e0ea;--primary:#3457d5;--primary2:#2746b6;--good:#138a55;--bad:#c43c3c;
  --warn:#d18a00;--shadow:0 10px 30px rgba(20,32,60,.08);--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid rgba(52,87,213,.28);outline-offset:2px}
a{color:var(--primary)}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1200px;margin:auto;padding:14px 20px;display:flex;gap:12px;align-items:center}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:white;display:grid;place-items:center}
.spacer{flex:1}
.container{max-width:1200px;margin:auto;padding:28px 20px 60px}
.hero{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.hero h1{margin:0 0 7px;font-size:34px;letter-spacing:-1px}
.hero p{margin:0;color:var(--muted)}
.btn{border:1px solid var(--line);background:white;color:var(--text);padding:10px 14px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:#f4f6fb}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary2)}
.btn.danger{color:var(--bad);border-color:#efb5b5}
.btn.good{color:var(--good);border-color:#b8e1cc}
.btn.small{padding:7px 10px;font-size:13px;border-radius:10px}
.btn.link{border:none;background:transparent;padding:7px 2px;color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.module-card{padding:18px;display:flex;flex-direction:column;min-height:260px}
.module-card h3{margin:0 0 7px;font-size:20px}
.muted{color:var(--muted)}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}
.chip.filled{background:#e9edff;border-color:#bdc7ff;color:#3045a3}
.chip.good{background:#e8f7ef;border-color:#b9e7cf;color:var(--good)}
.chip.warn{background:#fff5dc;border-color:#efd7a0;color:#936000}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:42px;min-width:180px;background:white;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);z-index:20}
.menu button{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px}
.menu button:hover{background:#f4f6fb}
.empty{padding:40px;text-align:center;border:1px dashed #b9c2d3;border-radius:var(--radius);background:white}
.empty h3{margin-top:0}
.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;font-weight:800}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:white;color:var(--text)}
textarea{min-height:180px;resize:vertical;line-height:1.45}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{border:0;background:transparent;padding:11px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.notice{padding:12px 14px;border-radius:12px;border:1px solid #d5dded;background:#f6f8fd;color:#42526b}
.notice.good{border-color:#bfe3cf;background:#eefaf3;color:#276a48}
.notice.bad{border-color:#efc2c2;background:#fff2f2;color:#9b3030}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 22px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}
.sidebar{align-self:start;position:sticky;top:82px}
.side-list{display:flex;flex-direction:column;gap:6px}
.side-btn{border:1px solid transparent;background:transparent;padding:10px;border-radius:10px;text-align:left}
.side-btn:hover{background:#f4f6fb}
.side-btn.active{background:#e9edff;border-color:#c8d0ff;color:#253b9c;font-weight:800}
.read-content{line-height:1.75;font-size:16px}
.read-content p{margin:0 0 16px}
.read-content ul{margin-top:0}
.handout-part{border-top:1px solid var(--line);padding:18px 0 4px}
.handout-part:first-child{border-top:0;padding-top:0}
.handout-part h3{margin:0 0 9px;font-size:18px}
.handout-role{font-size:11px;color:var(--primary);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.handout-part.memory{background:#fff8e8;border:1px solid #efd7a0;border-radius:12px;padding:14px;margin-top:14px}
.config-list{display:grid;gap:10px}
.radio-row,.check-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.quiz-shell{max-width:920px;margin:auto}
.quiz-head{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}
.quiz-head h2{margin:0}
.score-box{margin-left:auto;text-align:right}
.score-box b{font-size:22px}
.progress-segments{display:grid;gap:4px;margin:12px 0 20px}
.seg{height:7px;border-radius:999px;background:#fff;border:1px solid #cfd6e2}
.seg.current{background:#f2b84b;border-color:#f2b84b}
.seg.correct{background:#36a86f;border-color:#36a86f}
.seg.wrong{background:#d85b5b;border-color:#d85b5b}
.q-card{padding:22px}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.q-format{font-size:13px;color:var(--muted);margin-bottom:18px}
.prompt{font-size:20px;font-weight:800;line-height:1.4;margin-bottom:18px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;background:white}
.choice.correct{border-color:#8fd0ad;background:#effaf4}
.choice.wrong{border-color:#e5a1a1;background:#fff1f1}
.feedback{margin-top:18px;border-left:4px solid var(--primary);background:#f4f6ff;padding:14px 16px;border-radius:10px}
.feedback.good{border-color:var(--good);background:#effaf4}
.feedback.bad{border-color:var(--bad);background:#fff2f2}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.legend-item{border:1px solid var(--line);background:var(--panel2);padding:7px 9px;border-radius:10px}
.match-row{display:grid;grid-template-columns:34px minmax(0,1fr) 110px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf0f5}
.match-row.good{background:#f2fbf6}
.match-row.bad{background:#fff4f4}
.result-hero{text-align:center;padding:30px 20px}
.result-hero .pct{font-size:64px;font-weight:900;letter-spacing:-2px}
.review-item{border-left:5px solid var(--line);padding:14px 16px;margin:12px 0;background:#fff;border-radius:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.review-item.correct{border-left-color:var(--good)}
.review-item.incorrect,.review-item.shown,.review-item.skipped{border-left-color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase}
.exam-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
.exam-side{align-self:start;position:sticky;top:82px}
.timer{font-size:28px;font-weight:900;margin:4px 0 14px}
.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav-q{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 0;font-size:12px}
.nav-q.answered{background:#e7f7ef;border-color:#acd9c1}
.nav-q.flagged{outline:2px solid #e2ad36}
.nav-q.current{box-shadow:inset 0 0 0 2px var(--primary)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:20px;z-index:100}
.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal h2{margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.hr{height:1px;background:var(--line);margin:18px 0}
.right{margin-left:auto}
.hidden{display:none!important}
.pre{white-space:pre-wrap}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef1f6;border:1px solid #d7dce7;border-radius:6px;padding:2px 5px;font-size:12px}
@media(max-width:900px){
  .grid{grid-template-columns:1fr 1fr}
  .split,.exam-layout{grid-template-columns:1fr}
  .sidebar,.exam-side{position:static}
  .stat-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .container{padding:20px 14px 44px}
  .topbar-inner{padding:12px 14px}
  .grid{grid-template-columns:1fr}
  .hero{align-items:flex-start;flex-direction:column}
  .form-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .quiz-head{align-items:flex-start;flex-direction:column}
  .score-box{margin-left:0;text-align:left}
}

/* Study Reviewer design system — Focused Workspace */
:root{
  color-scheme:light;
  --bg:#f2f5f3;--panel:#ffffff;--panel2:#f7f9f8;--text:#14241f;--muted:#64736d;
  --line:#d9e2de;--line-strong:#bdccc6;--primary:#12685e;--primary2:#0c5049;
  --primary-soft:#e6f2ef;--good:#167056;--bad:#b54747;--warn:#a46519;
  --shadow:0 16px 40px rgba(26,49,41,.07);--shadow-sm:0 5px 18px rgba(26,49,41,.06);
  --radius:16px;--radius-sm:10px;--focus:rgba(18,104,94,.24);
}
*{scrollbar-color:#b7c7c1 transparent}
::selection{background:#cce6df;color:#10241f}
html{background:var(--bg);scroll-behavior:smooth}
body{min-width:320px;background:var(--bg);font-size:15px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.app{background:linear-gradient(180deg,#f8faf9 0,#f2f5f3 190px);min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(252,253,252,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(189,204,198,.72)}
.topbar-inner{max-width:1180px;min-height:72px;margin:auto;padding:12px 24px;gap:16px}
.brand{gap:12px;font-size:inherit;letter-spacing:0;color:var(--text);user-select:none}
.brand-mark{position:relative;width:38px;height:38px;border-radius:10px;background:var(--text);font-size:12px;letter-spacing:.08em;box-shadow:4px 4px 0 #a9d3c9;isolation:isolate}
.brand-mark::after{content:"";position:absolute;left:8px;right:8px;bottom:7px;height:2px;background:#75bbae;border-radius:2px;z-index:-1}
.brand-copy{display:flex;flex-direction:column;line-height:1.12}
.brand-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand-subtitle{margin-top:4px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.container{max-width:1180px;margin:auto;padding:48px 24px 72px}
.hero{align-items:center;margin-bottom:28px;gap:24px}
.hero h1{margin:0 0 8px;max-width:760px;font-size:clamp(32px,4vw,44px);line-height:1.08;letter-spacing:-.045em;font-weight:780}
.hero p{max-width:680px;font-size:16px;color:var(--muted)}
.hero>div>.muted:first-child{margin-bottom:8px;color:var(--primary);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.btn{min-height:42px;padding:9px 14px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:rgba(255,255,255,.84);color:var(--text);font-size:14px;font-weight:740;letter-spacing:-.01em;box-shadow:0 1px 0 rgba(20,36,31,.03);transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease}
.btn:hover{background:#fff;border-color:#91aaa1;box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(18,104,94,.18)}
.btn.primary:hover{background:var(--primary2);border-color:var(--primary2);box-shadow:0 7px 18px rgba(18,104,94,.23)}
.btn.danger{color:var(--bad);border-color:#e0bcbc;background:#fffafa}
.btn.danger:hover{background:#fff3f3;border-color:#cf9191}
.btn.good{color:var(--good);border-color:#acd5c5;background:#f6fcf9}
.btn.small{min-height:36px;padding:7px 11px;font-size:13px;border-radius:9px}
.btn.link{min-height:36px;border:0;background:transparent;color:var(--primary);box-shadow:none}
.btn.link:hover{background:var(--primary-soft);transform:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn:disabled{transform:none;box-shadow:none}
.btn-icon{display:inline-grid;width:18px;height:18px;place-items:center;font-size:19px;font-weight:500;line-height:1}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card,.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow-sm)}
.panel{padding:22px}
.module-card{position:relative;min-height:275px;padding:21px;overflow:visible;box-shadow:none;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.module-card::before{content:"";position:absolute;top:0;left:21px;width:44px;height:3px;border-radius:0 0 4px 4px;background:#74b9ac}
.module-card:hover{border-color:#b8cac3;box-shadow:var(--shadow);transform:translateY(-2px)}
.module-card h3{margin:7px 0 7px;font-size:20px;line-height:1.25;letter-spacing:-.025em}
.module-card>.muted{font-size:13px}
.actions{gap:7px;padding-top:14px;border-top:1px solid #edf1ef}
.empty{position:relative;max-width:760px;margin:54px auto 0;padding:56px 36px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.78);box-shadow:none}
.empty::before,.empty::after{content:"";position:absolute;width:48px;height:1px;background:#91bbb2;top:74px}
.empty::before{left:calc(50% - 84px)}.empty::after{right:calc(50% - 84px)}
.empty-mark{display:grid;width:48px;height:48px;margin:0 auto 20px;place-items:center;border-radius:12px;background:var(--text);color:#fff;font-size:12px;font-weight:850;letter-spacing:.08em;box-shadow:4px 4px 0 #a9d3c9}
.empty h3{margin:0 0 7px;font-size:23px;letter-spacing:-.03em}
.empty p{margin:0 auto 22px;max-width:460px}
.meta-row{gap:6px;margin:16px 0}
.chip{min-height:27px;padding:4px 8px;border:1px solid var(--line);background:#f7f9f8;color:#56665f;font-size:11px;font-weight:760;letter-spacing:.015em}
.chip.filled{background:var(--primary-soft);border-color:#c3dfd8;color:#0f6157}
.chip.good{background:#e9f6f0;border-color:#b8ddce;color:var(--good)}
.chip.warn{background:#fff6e6;border-color:#ecd4aa;color:#8a5716}
.notice{padding:13px 15px;border:1px solid #cfdcd7;border-radius:11px;background:#f7faf9;color:#465850;font-size:14px}
.notice.good{border-color:#b9dccc;background:#eff8f4;color:#285f4c}
.notice.bad{border-color:#e5c0c0;background:#fff4f4;color:#943d3d}
.notice.warn{border-color:#ead2a8;background:#fff8eb;color:#7d531a}
.stat-grid{grid-template-columns:repeat(4,1fr);gap:1px;margin:18px 0 24px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--line);box-shadow:none}
.stat{padding:17px 18px;border:0;border-radius:0;background:#fff}
.stat span{font-size:11px;font-weight:760;letter-spacing:.06em;text-transform:uppercase}
.stat b{margin-top:5px;font-size:26px;line-height:1.05;letter-spacing:-.04em}
.feature-panel{position:relative;min-height:190px;padding-top:46px;box-shadow:none}
.feature-panel h3{margin:0 0 6px;font-size:20px;letter-spacing:-.025em}
.feature-panel p{min-height:46px;margin:0 0 18px}
.feature-panel.featured{border-color:#b9d6cf;background:linear-gradient(180deg,#fff 0,#f7fbfa 100%)}
.feature-index{position:absolute;top:18px;left:22px;color:#7c8c86;font:750 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.field{gap:7px}
.field label{color:#34463f;font-size:12px;font-weight:780;letter-spacing:.015em}
input[type=text],input[type=password],input[type=number],select,textarea{min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:#fff;color:var(--text);box-shadow:inset 0 1px 1px rgba(20,36,31,.025);transition:border-color .15s ease,box-shadow .15s ease}
input:hover,select:hover,textarea:hover{border-color:#9eb3ab}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus);outline:0}
textarea{min-height:190px;line-height:1.55}
.tabs{gap:24px;margin:2px 0 20px;border-bottom:1px solid var(--line)}
.tab{position:relative;min-height:44px;padding:10px 0;border-bottom:0;color:#6b7974;font-size:14px;font-weight:740}
.tab::after{content:"";position:absolute;right:0;bottom:-1px;left:0;height:2px;border-radius:2px;background:transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom:0}
.tab.active::after{background:var(--primary)}
.radio-row,.check-row{min-height:46px;padding:10px 12px;border-color:var(--line);border-radius:10px;background:#fff}
.radio-row:hover,.check-row:hover{border-color:#a7bbb3;background:#fbfcfc}
input[type=radio],input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary)}
.menu{top:40px;min-width:190px;padding:6px;border-color:var(--line);border-radius:11px;box-shadow:0 18px 45px rgba(22,42,35,.14)}
.menu button{min-height:38px;color:var(--text);font-size:13px;font-weight:650}
.menu button:hover{background:var(--panel2)}
.split{grid-template-columns:230px minmax(0,1fr);gap:20px}
.sidebar{top:92px;padding:14px;box-shadow:none}
.sidebar>b{display:block;padding:5px 8px 10px;color:#78857f;font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.side-list{gap:3px}
.side-btn{min-height:40px;padding:9px 10px;color:#56665f;font-size:13px;font-weight:650}
.side-btn:hover{background:#f1f5f3}
.side-btn.active{border-color:#c4ded7;background:var(--primary-soft);color:#0f6157;font-weight:760}
.read-content{max-width:760px;color:#293a34;font-size:16px;line-height:1.78}
.read-content p{margin:0 0 17px}
.handout-part{padding:22px 0 5px;border-top-color:#e5ebe8}
.handout-part h3{font-size:20px;letter-spacing:-.025em}
.handout-role{margin-bottom:5px;color:var(--primary);font-size:10px;letter-spacing:.09em}
.handout-part.memory{margin-top:18px;padding:18px;border-color:#e3d5ad;border-radius:12px;background:#fffaf0}
.quiz-shell{max-width:900px}
.quiz-head{align-items:center;margin-bottom:16px}
.quiz-head h2{font-size:25px;letter-spacing:-.03em}
.score-box b{font-size:20px;color:var(--primary)}
.progress-segments{gap:3px;margin:13px 0 22px}
.seg{height:5px;border:0;background:#dfe6e3}
.seg.current{background:#d39b48}.seg.correct{background:#4c9c7d}.seg.wrong{background:#c96a6a}
.q-card{padding:26px;box-shadow:var(--shadow)}
.prompt{max-width:760px;font-size:22px;line-height:1.42;letter-spacing:-.02em}
.q-format{font-size:12px}
.choice{min-height:48px;margin:8px 0;padding:12px 13px;border-color:var(--line);border-radius:10px;transition:border-color .15s ease,background-color .15s ease,transform .15s ease}
.choice:hover{border-color:#9eb7ae;background:#fafcfb;transform:translateX(2px)}
.choice.correct{border-color:#91c7b0;background:#eff8f4}.choice.wrong{border-color:#dda3a3;background:#fff3f3}
.feedback{border-left-width:3px;border-radius:8px;background:#f0f6f4}
.exam-layout{grid-template-columns:210px minmax(0,1fr);gap:20px}
.exam-side{top:92px;padding:17px;box-shadow:none}
.timer{font-size:30px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.nav-grid{gap:5px}
.nav-q{min-height:34px;border-color:var(--line);border-radius:7px;color:#51615b}
.nav-q.answered{border-color:#afd5c5;background:#eaf6f1}.nav-q.flagged{outline:2px solid #d8a94f;outline-offset:1px}.nav-q.current{box-shadow:inset 0 0 0 2px var(--primary)}
.result-hero{padding:38px 22px;background:linear-gradient(180deg,#fff,#f8fbfa)}

.review-item{padding:16px 18px;border-color:var(--line);border-left-width:4px;border-radius:10px;box-shadow:none}
table{font-size:14px}
th,td{padding:12px 10px}
th{color:#74827d;font-size:10px;letter-spacing:.07em}
.modal-backdrop{background:rgba(10,26,21,.54);backdrop-filter:blur(3px)}
.modal{width:min(640px,100%);padding:24px;border:1px solid rgba(255,255,255,.6);border-radius:17px;box-shadow:0 28px 80px rgba(10,30,23,.28)}
.modal h2{font-size:24px;letter-spacing:-.03em}
.kbd{border-color:#d5dfdb;background:#eef2f0;color:#384942}
.pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6}

@media(max-width:980px){

  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .feature-panel{min-height:180px}

  .side-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}

}

  .hero{align-items:flex-start;flex-direction:column;margin-bottom:22px;gap:16px}

  .grid{grid-template-columns:1fr;gap:13px}

  .stat-grid{grid-template-columns:1fr 1fr}

  .tab{flex:0 0 auto}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="homeBrand" role="button" tabindex="0" aria-label="Study Reviewer home"><span class="brand-mark" aria-hidden="true">SR</span><span class="brand-copy"><span class="brand-title">Study Reviewer</span><span class="brand-subtitle">Active learning workspace</span></span></div>
      <div class="spacer"></div>
      <button class="btn small" id="settingsBtn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.86 1.86-.06-.06A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V20h-2.6v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.88.34l-.06.06-1.86-1.86.06-.06A1.7 1.7 0 0 0 7.5 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4h-.1V11h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.34-1.88L7 7.96 8.86 6.1l.06.06A1.7 1.7 0 0 0 10.8 6.5a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1v-.1h2.6v.1a1.7 1.7 0 0 0 1.1 1.6 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.86 1.86-.06.06A1.7 1.7 0 0 0 19.3 9.8a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v2.6H21a1.7 1.7 0 0 0-1.6 1.2Z"/></svg><span>Settings</span></button>
    </div>
  </header>
  <main id="app" class="container"></main>
</div>
<div id="modalRoot"></div>
<input id="filePicker" type="file" class="hidden" />
<script>
if (typeof pdfjsLib !== "undefined") {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.7.570/pdf.worker.min.js";
}

const LS_MODULES = "studyReviewer.modules.v1";
const LS_SETTINGS = "studyReviewer.settings.v1";
const LS_SESSIONS = "studyReviewer.sessions.v1";
const BACKUP_VERSION = 2;

const STANDARD_HANDOUT_PARTS = [
  {key:"topic",title:"Topic / Definition",role:"Core source"},
  {key:"how",title:"How It Works",role:"Process"},
  {key:"terms",title:"Important Terms",role:"Term questions"},
  {key:"diagram",title:"Diagram / Image Explanation",role:"Visual recall"},
  {key:"examples",title:"Examples",role:"Scenario questions"},
  {key:"differences",title:"Important Differences",role:"Compare / contrast"},
  {key:"comptia",title:"CompTIA A+ Key Points",role:"High-value recall"},
  {key:"traps",title:"Common Confusion / Exam Traps",role:"Exam traps"},
  {key:"recap",title:"Short Recap",role:"Review"},
  {key:"memory",title:"Memory Version",role:"Quick recall only"}
];

const state = {
  view: "library",
  moduleId: null,
  editId: null,
  editTab: "paste",
  readSectionId: null,
  quizConfig: null,
  quiz: null,
  quizResults: null,
  examConfig: null,
  exam: null,
  examResults: null,
  detailNotice: "",
  authorType: "term",
  editQuestionId: null,
  importBuffer: null,
  moduleDraftText: "",
  moduleDraftTitle: ""
};

const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const uid = (p="id") => p + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = (v="") => String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = v => String(v ?? "").trim().toLowerCase().replace(/\s+/g," ");
const shuffle = arr => {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
};

function matchStandardHeading(line){
  let value=String(line||"").trim()
    .replace(/^#{1,6}\s*/,"")
    .replace(/^\*{1,2}|\*{1,2}$/g,"")
    .replace(/^\s*(?:section\s+)?\d{1,2}\s*[.)\-:]\s*/i,"")
    .trim();
  const aliases=[
    ["topic",["topic / definition","topic and definition","topic definition"]],
    ["how",["how it works"]],
    ["terms",["important terms"]],
    ["diagram",["diagram / image explanation","diagram and image explanation","diagram image explanation","diagram explanation","image explanation"]],
    ["examples",["examples"]],
    ["differences",["important differences"]],
    ["comptia",["comptia a+ key points","comptia a plus key points"]],
    ["traps",["common confusion / exam traps","common confusion and exam traps","common confusion exam traps","exam traps"]],
    ["recap",["short recap"]],
    ["memory",["memory version"]]
  ];
  const lower=value.toLowerCase();
  for(const [key,names] of aliases){
    for(const name of names){
      if(lower===name)return {key,inline:""};
      if(lower.startsWith(name+":")||lower.startsWith(name+" — ")||lower.startsWith(name+" - ")){
        return {key,inline:value.slice(name.length).replace(/^\s*(?::|—|-)\s*/,"").trim()};
      }
    }
  }
  return null;
}
function detectStandardSections(text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  const found=[];let current=null;const preamble=[];
  for(const line of lines){
    const heading=matchStandardHeading(line);
    if(heading){
      if(current)found.push(current);
      current={key:heading.key,lines:heading.inline?[heading.inline]:[]};
    }else if(current)current.lines.push(line);else preamble.push(line);
  }
  if(current)found.push(current);
  const distinct=new Set(found.map(x=>x.key));
  const distinctive=["differences","comptia","traps","memory"].some(key=>distinct.has(key));
  if(distinct.size<3&&!(distinct.size>=2&&distinctive))return {isStandard:false,parts:[],preamble:"",recognizedCount:0};
  const parts=[];
  for(const def of STANDARD_HANDOUT_PARTS){
    const matches=found.filter(x=>x.key===def.key);
    if(!matches.length)continue;
    parts.push({...def,content:matches.map(x=>x.lines.join("\n").trim()).filter(Boolean).join("\n\n")});
  }
  return {isStandard:true,parts,preamble:preamble.join("\n").trim(),recognizedCount:distinct.size};
}
function prepareSection(section){
  const structured=detectStandardSections(section.content);
  return {...section,handoutParts:structured.isStandard?structured.parts:[],handoutPreamble:structured.preamble||"",standardStructure:structured.isStandard};
}
function hydrateQuestion(q){
  return {...q,aliases:Array.isArray(q.aliases)?q.aliases.filter(Boolean):[],mastery:{attempts:0,correct:0,streak:0,lastAttempt:null,lastResult:null,...(q.mastery||{})}};
}
function hydrateModule(m){
  const bank=m.questionBank||emptyBank();
  return {...m,sections:(m.sections||[]).map(prepareSection),questionBank:{
    terms:(bank.terms||[]).map(hydrateQuestion),
    enumerations:(bank.enumerations||[]).map(hydrateQuestion),
    matching:(bank.matching||[]).map(hydrateQuestion)
  }};
}
function getSessions(){try{return JSON.parse(localStorage.getItem(LS_SESSIONS)||"{}")||{}}catch{return {}}}
function setSessions(s){localStorage.setItem(LS_SESSIONS,JSON.stringify(s))}
function saveQuizSession(){const s=getSessions();if(state.quiz)s.quiz={...state.quiz};else delete s.quiz;setSessions(s)}
function saveExamSession(){const s=getSessions();if(state.exam){const {timerHandle,...exam}=state.exam;s.exam=exam}else delete s.exam;setSessions(s)}
function clearSavedSession(kind){const s=getSessions();delete s[kind];setSessions(s)}

function loadModules(){
  try{return JSON.parse(localStorage.getItem(LS_MODULES)||"[]").map(hydrateModule)}catch{return []}
}
function compactModule(m){return {...m,sections:(m.sections||[]).map(({handoutParts,handoutPreamble,standardStructure,...section})=>section)}}
function saveModules(mods){localStorage.setItem(LS_MODULES,JSON.stringify(mods.map(compactModule)))}
function getSettings(){
  const d={apiKey:"",aiEnabled:true};
  try{return {...d,...JSON.parse(localStorage.getItem(LS_SETTINGS)||"{}")}}catch{return d}
}
function saveSettings(s){localStorage.setItem(LS_SETTINGS,JSON.stringify(s))}
function getModule(id){return loadModules().find(m=>m.id===id)}
function updateModule(id, fn){
  const mods=loadModules(); const i=mods.findIndex(m=>m.id===id);
  if(i<0)return null;
  mods[i]=fn(JSON.parse(JSON.stringify(mods[i])))||mods[i]; saveModules(mods); return mods[i];
}
function emptyBank(){return {terms:[],enumerations:[],matching:[]}}
function bankCounts(m){
  const b=m.questionBank||emptyBank();
  return {terms:b.terms?.length||0,enumerations:b.enumerations?.length||0,matching:b.matching?.length||0,
    total:(b.terms?.length||0)+(b.enumerations?.length||0)+(b.matching?.length||0)};
}
function bankEntries(m){
  const b=m.questionBank||emptyBank();
  return [
    ...(b.terms||[]).map(q=>({...q,baseType:"term"})),
    ...(b.enumerations||[]).map(q=>({...q,baseType:"enumeration"})),
    ...(b.matching||[]).map(q=>({...q,baseType:"matching"}))
  ];
}
function masterySummary(m){
  const entries=bankEntries(m),attempted=entries.filter(q=>(q.mastery?.attempts||0)>0);
  const attempts=attempted.reduce((n,q)=>n+(q.mastery?.attempts||0),0);
  const correct=attempted.reduce((n,q)=>n+(q.mastery?.correct||0),0);
  const weak=attempted.filter(q=>q.mastery.attempts>=2&&(q.mastery.correct/q.mastery.attempts)<.7);
  return {attempted:attempted.length,attempts,correct,accuracy:attempts?Math.round(correct/attempts*100):0,weak};
}
function recordMastery(moduleId,questionId,isCorrect){
  if(!questionId)return;
  updateModule(moduleId,m=>{
    for(const key of ["terms","enumerations","matching"]){
      const q=(m.questionBank?.[key]||[]).find(x=>x.id===questionId);if(!q)continue;
      q.mastery={attempts:0,correct:0,streak:0,lastAttempt:null,lastResult:null,...(q.mastery||{})};
      q.mastery.attempts++;if(isCorrect){q.mastery.correct++;q.mastery.streak++}else q.mastery.streak=0;
      q.mastery.lastAttempt=new Date().toISOString();q.mastery.lastResult=!!isCorrect;return m;
    }
    return m;
  });
}
function structuredCount(m){return (m.sections||[]).filter(s=>s.standardStructure).length}
function sectionTitle(m,id){return m.sections.find(s=>s.id===id)?.title||"Unassigned"}
function bestExam(m){
  if(!m.examHistory?.length)return null;
  return [...m.examHistory].sort((a,b)=>b.percentage-a.percentage)[0];
}
function fmtDate(d){try{return new Date(d).toLocaleString()}catch{return d}}
function scoreBand(p){
  if(p<40)return "Review the handout first.";
  if(p<70)return "Getting there — retry what you missed.";
  if(p<90)return "Solid grasp.";
  return "Excellent retention — keep it active with periodic review.";
}
function navigate(view, moduleId=null){
  clearExamTimer();
  Object.assign(state,{view,moduleId});
  window.scrollTo({top:0,behavior:"instant"});
  render();
}
function clearExamTimer(){
  if(state.exam?.timerHandle){clearInterval(state.exam.timerHandle);state.exam.timerHandle=null}
}

$("#homeBrand").onclick=()=>navigate("library");
$("#settingsBtn").onclick=openSettings;
$("#homeBrand").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")navigate("library")};

function render(){
  const app=$("#app");
  app.oninput=null;app.onchange=null;
  if(state.view==="library") renderLibrary(app);
  else if(state.view==="edit") renderEdit(app);
  else if(state.view==="detail") renderDetail(app);
  else if(state.view==="read") renderRead(app);
  else if(state.view==="quizConfig") renderQuizConfig(app);
  else if(state.view==="quiz") renderQuiz(app);
  else if(state.view==="quizResults") renderQuizResults(app);
  else if(state.view==="examConfig") renderExamConfig(app);
  else if(state.view==="exam") renderExam(app);
  else if(state.view==="examResults") renderExamResults(app);
}

function renderLibrary(app){
  const mods=loadModules();
  const sessions=getSessions(),unfinished=[sessions.quiz&&getModule(sessions.quiz.moduleId)?"quiz":null,sessions.exam&&getModule(sessions.exam.moduleId)?"exam":null].filter(Boolean);
  app.innerHTML=`
    <section class="hero">
      <div><h1>Your study library</h1><p>Read your material, drill it casually, or simulate exam conditions.</p></div>
      <button class="btn primary" id="newModuleBtn"><span class="btn-icon" aria-hidden="true">+</span> New module</button>
    </section>
    ${unfinished.length?`<div class="notice warn" style="margin-bottom:18px"><b>Unfinished session${unfinished.length>1?"s":""}</b><div class="row" style="margin-top:9px">${unfinished.map(k=>`<button class="btn small" data-resume="${k}">Resume ${k}</button><button class="btn small danger" data-discard="${k}">Discard ${k}</button>`).join("")}</div></div>`:""}
    ${mods.length?`<div class="grid">${mods.map(moduleCard).join("")}</div>`:
      `<div class="empty"><div class="empty-mark" aria-hidden="true">SR</div><h3>Build your first study module</h3><p class="muted">Bring in a handout, paste your notes, or restore an existing module.</p><button class="btn primary" id="emptyNewBtn"><span class="btn-icon" aria-hidden="true">+</span> Create module</button></div>`}
  `;
  $("#newModuleBtn")?.addEventListener("click",()=>startEdit());
  $("#emptyNewBtn")?.addEventListener("click",()=>startEdit());
  $$("[data-action=read]").forEach(b=>b.onclick=()=>{state.readSectionId=null;navigate("read",b.dataset.id)});
  $$("[data-action=quiz]").forEach(b=>b.onclick=()=>navigate("quizConfig",b.dataset.id));
  $$("[data-action=exam]").forEach(b=>b.onclick=()=>navigate("examConfig",b.dataset.id));
  $$("[data-menu]").forEach(b=>b.onclick=e=>toggleMenu(e,b.dataset.menu));
  $$("[data-action=edit]").forEach(b=>b.onclick=()=>startEdit(b.dataset.id));
  $$("[data-action=export]").forEach(b=>b.onclick=()=>exportModule(b.dataset.id));
  $$("[data-action=delete]").forEach(b=>b.onclick=()=>deleteModule(b.dataset.id));
  $$("[data-title]").forEach(b=>b.onclick=()=>navigate("detail",b.dataset.title));
  $$("[data-resume]").forEach(b=>b.onclick=()=>resumeSession(b.dataset.resume));
  $$("[data-discard]").forEach(b=>b.onclick=()=>{const kind=b.dataset.discard;clearSavedSession(kind);state[kind]=null;render()});
}
function moduleCard(m){
  const c=bankCounts(m), best=bestExam(m),structured=structuredCount(m);
  return `<article class="card module-card">
    <div class="row"><h3 data-title="${m.id}" style="cursor:pointer">${esc(m.title)}</h3>
      <div class="right menu-wrap">
        <button class="btn small" data-menu="${m.id}" aria-label="More options">⋮</button>
        <div class="menu hidden" id="menu-${m.id}">
          <button data-action="edit" data-id="${m.id}">Edit module</button>
          <button data-action="export" data-id="${m.id}">Export JSON</button>
          <button data-action="delete" data-id="${m.id}" style="color:var(--bad)">Delete module</button>
        </div>
      </div>
    </div>
    <div class="muted">${m.sections.length} section${m.sections.length===1?"":"s"}${structured?` · ${structured} structured handout${structured===1?"":"s"}`:""}</div>
    <div class="meta-row">
      <span class="chip">Terms ${c.terms}</span><span class="chip">Enumerations ${c.enumerations}</span><span class="chip">Matching ${c.matching}</span>
    </div>
    <div class="notice ${best?"good":""}" style="margin-bottom:14px">
      ${best?`Best practice exam: <b>${best.percentage}%</b> (${best.correct}/${best.totalQuestions})`:"No practice exam attempts yet."}
    </div>
    <div class="actions">
      <button class="btn small" data-action="read" data-id="${m.id}">Read</button>
      <button class="btn small" data-action="quiz" data-id="${m.id}">Quiz</button>
      <button class="btn primary small" data-action="exam" data-id="${m.id}">Practice exam</button>
    </div>
  </article>`;
}
function toggleMenu(e,id){
  e.stopPropagation();
  const target=$("#menu-"+CSS.escape(id));
  $$(".menu").forEach(m=>{if(m!==target)m.classList.add("hidden")});
  target?.classList.toggle("hidden");
}
document.addEventListener("click",()=>$$(".menu").forEach(m=>m.classList.add("hidden")));

function startEdit(id=null){
  state.editId=id; state.editTab="paste"; state.importBuffer=null;
  const m=id?getModule(id):null;
  state.moduleDraftTitle=m?.title||"";
  state.moduleDraftText=m?sectionsToText(m):"";
  navigate("edit",id);
}
function sectionsToText(m){
  if(m.sections.length===1 && m.sections[0].title===m.title) return m.sections[0].content;
  return m.sections.map(s=>`## ${s.title}\n${s.content}`).join("\n\n");
}
function renderEdit(app){
  const isEdit=!!state.editId;
  app.innerHTML=`
    <section class="hero"><div><h1>${isEdit?"Edit module":"New module"}</h1><p>Use one of the three input paths below.</p></div>
      <button class="btn" id="cancelEdit">← Library</button></section>
    <div class="panel">
      <div class="field" style="margin-bottom:16px"><label>Module title</label><input id="moduleTitle" type="text" value="${esc(state.moduleDraftTitle)}" placeholder="e.g. Risk Management"></div>
      <div class="tabs">
        ${tabBtn("paste","Paste text")}${tabBtn("upload","Upload file")}${tabBtn("json","Import JSON")}
      </div>
      <div id="editTabBody"></div>
      <div class="row end" style="margin-top:18px">

async function extractDocxText(arrayBuffer){
  if(typeof mammoth==="undefined")throw new Error("The .docx reader didn't load (internet is required for the parser library). Try again once you're online, or paste the text instead.");
  let r;
  if(typeof mammoth.extractRawText==="function") r=await mammoth.extractRawText({arrayBuffer});
  else if(typeof mammoth.convertToRawText==="function") r=await mammoth.convertToRawText({arrayBuffer});
  else throw new Error("The loaded Mammoth library does not expose a DOCX raw-text extractor.");
  return r?.value||"";
}

async function extractTextFromFile(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(ext==="txt") return await file.text();
  if(ext==="docx"){
    const ab=await file.arrayBuffer();
    return await extractDocxText(ab);
  }
  if(ext==="pdf"){
    if(typeof pdfjsLib==="undefined")throw new Error("The .pdf reader didn't load (internet is required for the parser library). Try again once you're online, or paste the text instead.");
    const ab=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise, pages=[];
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p), tc=await page.getTextContent();
      pages.push(tc.items.map(i=>i.str).join(" "));
    }
    return pages.join("\n\n");
  }
  throw new Error("Unsupported file type.");
}

function sectionTitleFromPath(path){
  return String(path||"Untitled section")
    .replace(/\\/g,"/")
    .replace(/^[^/]+\//,"")
    .replace(/\.(txt|docx|pdf)$/i,"")
    .replace(/\//g," / ")
    .trim() || "Untitled section";
}

function setImportedSections(parts, fallbackTitle=""){
  const valid=parts.filter(x=>x && x.text && x.text.trim());
  if(!valid.length)throw new Error("No readable .txt, .docx, or .pdf files were found.");
  state.moduleDraftText=valid.map(x=>`## ${x.title}\n${x.text.trim()}`).join("\n\n");
  const ta=$("#sourceText"); if(ta)ta.value=state.moduleDraftText;
  if(!state.moduleDraftTitle.trim() && fallbackTitle){
    state.moduleDraftTitle=fallbackTitle;
    const titleInput=$("#moduleTitle"); if(titleInput)titleInput.value=fallbackTitle;
  }
  return valid.length;
}

async function handleStudyFile(e){
  const f=e.target.files?.[0]; if(!f)return;
  const st=$("#fileStatus"); st.textContent="Reading…";
  try{
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    if(ext==="zip"){
      if(typeof JSZip==="undefined")throw new Error("The ZIP reader didn't load (internet is required for the parser library). Try again once you're online.");
      const zip=await JSZip.loadAsync(await f.arrayBuffer());
      const entries=Object.values(zip.files).filter(x=>!x.dir && /\.(txt|docx|pdf)$/i.test(x.name));
      const parts=[]; let skipped=0;
      for(const entry of entries){
        try{
          const ext=(entry.name.split(".").pop()||"").toLowerCase();
          let text="";
          if(ext==="txt") text=await entry.async("string");
          else if(ext==="docx"){
            const ab=await entry.async("arraybuffer");
            text=await extractDocxText(ab);
          }else if(ext==="pdf"){
            if(typeof pdfjsLib==="undefined")throw new Error("PDF parser unavailable");
            const ab=await entry.async("arraybuffer");
            const pdf=await pdfjsLib.getDocument({data:ab}).promise, pages=[];
            for(let p=1;p<=pdf.numPages;p++){
              const page=await pdf.getPage(p), tc=await page.getTextContent();
              pages.push(tc.items.map(i=>i.str).join(" "));
            }
            text=pages.join("\n\n");
          }
          if(text.trim())parts.push({title:sectionTitleFromPath(entry.name),text}); else skipped++;
        }catch{skipped++}
      }
      const count=setImportedSections(parts,f.name.replace(/\.zip$/i,""));
      st.textContent=`Loaded ${count} supported file${count===1?"":"s"} from ${f.name}${skipped?` · skipped ${skipped}`:""}.`;
    }else{
      const text=await extractTextFromFile(f);
      state.moduleDraftText=text;
      $("#sourceText").value=text;
      if(!state.moduleDraftTitle.trim()){
        state.moduleDraftTitle=f.name.replace(/\.(txt|docx|pdf)$/i,"");
        $("#moduleTitle").value=state.moduleDraftTitle;
      }
      const structure=detectStandardSections(text);
      st.textContent=`Loaded ${f.name}${structure.isStandard?` · recognized ${structure.recognizedCount}/10 standard handout headings`:" · using normal-document fallback"}`;
    }
  }catch(err){st.textContent="Could not read file: "+err.message}
}

async function handleStudyFolder(e){
  const files=[...(e.target.files||[])]; if(!files.length)return;
  const st=$("#fileStatus");
  const supported=files.filter(f=>/\.(txt|docx|pdf)$/i.test(f.name));
  if(!supported.length){st.textContent="No supported .txt, .docx, or .pdf files were found in that folder.";return}
  st.textContent=`Reading 0/${supported.length} supported files…`;
  const parts=[]; let failed=0; const failures=[];
  for(let i=0;i<supported.length;i++){
    const f=supported[i];
    const displayPath=f.webkitRelativePath||f.name;
    st.textContent=`Reading ${i+1}/${supported.length}: ${displayPath}`;
    try{
      const text=await extractTextFromFile(f);
      if(text.trim())parts.push({title:sectionTitleFromPath(displayPath),text});
      else {failed++;failures.push(`${displayPath}: no extractable text`)}
    }catch(err){failed++;failures.push(`${displayPath}: ${err.message}`)}
  }
  try{
    const root=(supported[0].webkitRelativePath||"").split("/")[0]||"Imported folder";
    const count=setImportedSections(parts,root);
    st.textContent=`Loaded ${count} supported file${count===1?"":"s"} from folder${failed?` · ${failed} could not be read`:""}.`;
  }catch(err){
    const detail=failures.length?` First error: ${failures[0]}`:"";
    st.textContent="Could not import folder: "+err.message+detail;
  }
}

function validateImportText(txt,show=false){
  const out=$("#jsonValidation");
  try{
    const obj=JSON.parse(txt);
    const errs=[];
    if(!obj||typeof obj!=="object")errs.push("Root must be an object.");
    if(!obj.title||typeof obj.title!=="string")errs.push("Missing string field: title.");
    if(!Array.isArray(obj.sections)||!obj.sections.length)errs.push("sections must be a non-empty array.");
    else obj.sections.forEach((s,i)=>{
      if(!s||typeof s.title!=="string"||typeof s.content!=="string")errs.push(`Section ${i+1} needs string title and content.`);
    });
    if(obj.questionBank){
      for(const k of ["terms","enumerations","matching"]) if(!Array.isArray(obj.questionBank[k])) errs.push(`questionBank.${k} must be an array.`);
    }
    if(errs.length)throw new Error(errs.join(" "));
    state.importBuffer=obj;
    if(show&&out)out.innerHTML=`<div class="notice good" style="margin-top:12px">Valid import: ${obj.sections.length} section(s)${obj.questionBank?" with question bank":""}.</div>`;
    return obj;
  }catch(err){
    state.importBuffer=null;
    if(show&&out)out.innerHTML=`<div class="notice bad" style="margin-top:12px">${esc(err.message)}</div>`;
    return null;
  }
}
function parseSections(title,text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  const sections=[]; let cur={title:title||"Untitled module",lines:[]};
  let sawHeading=false;
  for(const line of lines){
    if(line.startsWith("## ")&&!matchStandardHeading(line)){
      if(cur.lines.join("\n").trim()||sawHeading)sections.push({id:uid("sec"),title:cur.title,content:cur.lines.join("\n").trim()});
      sawHeading=true; cur={title:line.slice(3).trim()||"Untitled section",lines:[]};
    }else cur.lines.push(line);
  }
  if(cur.lines.join("\n").trim()||!sections.length)sections.push({id:uid("sec"),title:cur.title,content:cur.lines.join("\n").trim()});
  return sections.filter(s=>s.content||sections.length===1).map(prepareSection);
}
function normalizeImportedModule(obj,id=null){
  const sections=obj.sections.map(s=>prepareSection({id:s.id||uid("sec"),title:s.title,content:s.content}));
  const validSecIds=new Set(sections.map(s=>s.id));
  const bank=emptyBank();
  if(obj.questionBank){
    bank.terms=(obj.questionBank.terms||[]).map(q=>hydrateQuestion({...q,id:q.id||uid("q"),sectionId:validSecIds.has(q.sectionId)?q.sectionId:(sections[0]?.id||null),concept:q.concept||"General",explanation:q.explanation||""}));
    bank.enumerations=(obj.questionBank.enumerations||[]).map(q=>hydrateQuestion({...q,id:q.id||uid("q"),sectionId:validSecIds.has(q.sectionId)?q.sectionId:(sections[0]?.id||null),concept:q.concept||"General",items:Array.isArray(q.items)?q.items:[],explanation:q.explanation||""}));
    bank.matching=(obj.questionBank.matching||[]).map(q=>hydrateQuestion({...q,id:q.id||uid("q"),sectionId:validSecIds.has(q.sectionId)?q.sectionId:(sections[0]?.id||null),concept:q.concept||"General",pairs:Array.isArray(q.pairs)?q.pairs:[],explanation:q.explanation||""}));
  }
  return {id:id||uid("mod"),title:obj.title.trim(),sections,questionBank:bank,quizScores:obj.quizScores||{},examHistory:obj.examHistory||[],createdAt:obj.createdAt||new Date().toISOString()};
}
function saveModuleFromEditor(){
  const title=state.moduleDraftTitle.trim()||$("#moduleTitle")?.value.trim();
  if(state.editTab==="json"){
    const obj=state.importBuffer||validateImportText($("#jsonText")?.value||"",true);
    if(!obj)return;
    const existing=state.editId?getModule(state.editId):null;
    const normalized=normalizeImportedModule(obj,state.editId||null);
    if(existing){normalized.quizScores=existing.quizScores||{};normalized.examHistory=existing.examHistory||[];normalized.createdAt=existing.createdAt}
    persistOne(normalized);
    navigate("detail",normalized.id); return;
  }
  if(!title){alert("Enter a module title.");return}
  if(!state.moduleDraftText.trim()){alert("Add some study material.");return}
  const existing=state.editId?getModule(state.editId):null;
  const sections=parseSections(title,state.moduleDraftText);
  const remap=new Map();
  if(existing){
    // Preserve IDs for unchanged section titles when possible.
    for(const s of sections){
      const old=existing.sections.find(x=>x.title===s.title);
      if(old){remap.set(s.id,old.id);s.id=old.id;if(old.content===s.content&&old.bankGenerationVersion)s.bankGenerationVersion=old.bankGenerationVersion}
    }
  }
  const mod={
    id:state.editId||uid("mod"),title,sections,
    questionBank:existing?.questionBank||emptyBank(),
    quizScores:existing?.quizScores||{},
    examHistory:existing?.examHistory||[],
    createdAt:existing?.createdAt||new Date().toISOString()
  };
  // Remove questions whose section was deleted.
  const ids=new Set(sections.map(s=>s.id));
  for(const k of ["terms","enumerations","matching"])mod.questionBank[k]=(mod.questionBank[k]||[]).filter(q=>ids.has(q.sectionId));
  persistOne(mod); navigate("detail",mod.id);
}
function persistOne(mod){
  const mods=loadModules(), i=mods.findIndex(x=>x.id===mod.id);
  if(i>=0)mods[i]=mod; else mods.unshift(mod);

}

function buildGenerationPrompt(sec){
  const common=`Ground every item STRICTLY in the supplied source. Do not add outside facts, assumptions, examples, exam advice, distractor facts, or missing sections. Preserve the source's terminology. If the source does not support a useful item, return fewer items. Accepted aliases must also appear in, or be unambiguously supported by, the source.`;
  const schema=`Reply with ONLY this JSON:
{"terms":[{"term":"...","definition":"...","aliases":["..."],"concept":"...","purpose":"term|scenario|key_point|trap|process|diagram|recall","explanation":"..."}],
"enumerations":[{"prompt":"...","items":["..."],"concept":"...","purpose":"process|compare|key_point|trap|recall","explanation":"..."}],
"matching":[{"prompt":"...","concept":"...","purpose":"term|compare|scenario|diagram","pairs":[{"term":"...","description":"..."}],"explanation":"..."}]}`;
  if(!sec.standardStructure)return `${common}

Extract 5-10 key term questions where supported, any named or numbered lists worth memorizing, and useful matching sets with 3-6 pairs. Descriptions and explanations must be traceable to this source.

${schema}

SOURCE:
${sec.content}`;
  const byKey=Object.fromEntries(sec.handoutParts.map(p=>[p.key,p]));
  const present=sec.handoutParts.map(p=>p.title).join(", ");
  const source=[sec.handoutPreamble?`[Preamble]\n${sec.handoutPreamble}`:"",...sec.handoutParts.map(p=>`[${p.title}]\n${p.content||"(heading present with no content)"}`)].filter(Boolean).join("\n\n");
  return `${common}

This source follows a standardized handout structure. Detected sections: ${present}.

Use the detected sections deliberately:
- Important Terms: primary source for definition/identification and term matching questions.
- Important Differences: create compare/contrast enumeration or matching questions ONLY for contrasts explicitly stated there.
- CompTIA A+ Key Points: prioritize high-value recall questions, but do not add general CompTIA knowledge.
- Examples: create scenario/application questions using only the exact situations, values, commands, or addresses supplied.
- Common Confusion / Exam Traps: create trap-focused questions ONLY because that section is ${byKey.traps?"present":"absent; therefore create none"}.
- How It Works: use supported steps/processes for enumeration or sequencing recall.
- Diagram / Image Explanation: test only details described in the extracted text; do not infer unseen image content.
- Topic / Definition and Short Recap: use as grounding and reinforcement.
- Memory Version: use for quick-recall wording only. Never generate a fact supported solely by Memory Version; it must also be supported by another detected section.

Do not invent any of the ${10-sec.handoutParts.length} missing standard sections. Favor quality and coverage over reaching a quota.

${schema}

STRUCTURED SOURCE:
${source}`;
}
async function generateBankAI(moduleId){
  const m=getModule(moduleId), s=getSettings(), status=$("#genStatus");
  if(!s.aiEnabled){status.innerHTML=`<div class="notice bad">AI-assisted features are disabled in Settings. Manual entry remains available.</div>`;return}
  if(!s.apiKey){status.innerHTML=`<div class="notice bad">No Anthropic API key is saved. Open Settings, or use manual entry.</div>`;return}
  const missing=m.sections.filter(sec=>sec.standardStructure?sec.bankGenerationVersion!==2:!bankEntries(m).some(q=>q.sectionId===sec.id));
  if(!missing.length){status.innerHTML=`<div class="notice good">Every section already has at least one question. Nothing to generate.</div>`;return}
  $("#generateBank").disabled=true;
  const succeeded=[],failed=[];
  for(let i=0;i<missing.length;i++){
    const sec=missing[i];
    status.innerHTML=`<div class="notice">Generating ${i+1}/${missing.length}: <b>${esc(sec.title)}</b>…</div>`;
    try{
      const prompt=buildGenerationPrompt(sec);
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"x-api-key":s.apiKey,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:2000,messages:[{role:"user",content:prompt}]})
      });
      if(!resp.ok)throw new Error(`HTTP ${resp.status}: ${(await resp.text()).slice(0,180)}`);
      const data=await resp.json();
      const txt=(data.content||[]).map(x=>x.text||"").join("").trim().replace(/^```json\s*/i,"").replace(/```$/,"").trim();
      const obj=JSON.parse(txt);
      const generatedCount=(obj.terms?.length||0)+(obj.enumerations?.length||0)+(obj.matching?.length||0);if(!generatedCount)throw new Error("The AI returned no source-supported questions for this section.");
      updateModule(moduleId,x=>{
        x.questionBank=x.questionBank||emptyBank();
        for(const q of (obj.terms||[]).filter(q=>q.term&&q.definition))x.questionBank.terms.push(hydrateQuestion({id:uid("q"),sectionId:sec.id,concept:q.concept||"General",purpose:q.purpose||"term",term:q.term,definition:q.definition,aliases:Array.isArray(q.aliases)?q.aliases:[],explanation:q.explanation||""}));
        for(const q of (obj.enumerations||[]).filter(q=>q.prompt&&Array.isArray(q.items)&&q.items.length))x.questionBank.enumerations.push(hydrateQuestion({id:uid("q"),sectionId:sec.id,concept:q.concept||"General",purpose:q.purpose||"recall",prompt:q.prompt,items:q.items,explanation:q.explanation||""}));
        for(const q of (obj.matching||[]).filter(q=>q.prompt&&Array.isArray(q.pairs)&&q.pairs.length>=2))x.questionBank.matching.push(hydrateQuestion({id:uid("q"),sectionId:sec.id,concept:q.concept||"General",purpose:q.purpose||"term",prompt:q.prompt,pairs:q.pairs,explanation:q.explanation||""}));
        const target=x.sections.find(s=>s.id===sec.id);if(target)target.bankGenerationVersion=2;
        return x;
      });
      succeeded.push(sec.title);
    }catch(err){failed.push(`${sec.title}: ${err.message}`)}
  }
  state.detailNotice=succeeded.length?`✓ Generated bank items for ${succeeded.length} section(s).${failed.length?` ${failed.length} failed.`:""}`:`! No sections succeeded.`;
  render();
  if(failed.length) $("#genStatus").innerHTML=`<div class="notice bad">${failed.map(esc).join("<br>")}</div>`;
}

function formatRead(text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  let out="",inUl=false,para=[];
  const flushP=()=>{if(para.length){out+=`<p>${esc(para.join(" "))}</p>`;para=[]}};
  const closeUl=()=>{if(inUl){out+="</ul>";inUl=false}};
  for(const line of lines){
    if(line.startsWith("- ")){flushP();if(!inUl){out+="<ul>";inUl=true}out+=`<li>${esc(line.slice(2))}</li>`}
    else if(!line.trim()){flushP();closeUl()}
    else {closeUl();para.push(line.trim())}
  }
  flushP();closeUl();return out||"<p class='muted'>No content.</p>";
}

function eligibleQuizEntries(m,cfg){

function makeSessionQuestion(base,m,termMode="mix"){
  if(base.baseType==="term"){
    let format=termMode==="mix"?(Math.random()<.5?"mc":"id"):termMode;
    let choices=[];
    if(format==="mc"){
      const seen=new Set([norm(base.term)]),pool=[];
      for(const q of shuffle(m.questionBank.terms||[])){if(q.id===base.id||seen.has(norm(q.term)))continue;seen.add(norm(q.term));pool.push(q.term)}
      if(pool.length<3)format="id";else choices=shuffle([base.term,...pool.slice(0,3)]);
    }
    return {...base,sessionType:format==="mc"?"term-mc":"term-id",choices};
  }
  if(base.baseType==="matching"){
    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const legend=base.pairs.map((p,i)=>({...p,letter:letters[i]}));
    return {...base,sessionType:"matching",legend,rows:shuffle(legend.map(p=>({description:p.description,correct:p.letter,term:p.term})))};
  }
  return {...base,sessionType:"enumeration"};
}

  base=base.slice(0,Math.min(requested,base.length));
  const queue=base.map(q=>makeSessionQuestion(q,m,cfg.termMode));
  state.quiz={moduleId:m.id,cfg:{...cfg},queue,index:0,answers:queue.map(()=>null),drafts:queue.map(()=>null),score:0,startedAt:new Date().toISOString(),sourceKey:cfg.source,lengthKey:cfg.length};

  if(q.sessionType==="term-id")return `<input id="idAnswer" type="text" placeholder="Type the term" value="${esc(value||"")}" ${a&&!exam?"disabled":""}>`;
  if(q.sessionType==="enumeration")return `<textarea id="enumAnswer" style="min-height:140px" placeholder="One item per line" ${a&&!exam?"disabled":""}>${esc(Array.isArray(value)?value.join("\n"):value||"")}</textarea>${a?.partial?`<div class="notice ${a.state==="correct"?"good":"bad"}" style="margin-top:10px">Matched ${a.partial.matched}/${a.partial.total} expected items.</div>`:""}`;

  }

}
function choiceClass(c,q,a){if(c===q.term)return"correct";if(a.yourAnswer===c&&c!==q.term)return"wrong";return""}

function collectAnswer(q){
  if(q.sessionType==="term-mc")return $('input[name="mc"]:checked')?.value||"";
  if(q.sessionType==="term-id")return $("#idAnswer")?.value||"";
  if(q.sessionType==="enumeration")return ($("#enumAnswer")?.value||"").split("\n").map(x=>x.trim()).filter(Boolean);
  if(q.sessionType==="matching"){const o={};$$(".matchSelect").forEach(s=>o[s.dataset.row]=s.value);return o}
  return "";
}
function gradeAnswer(q,yourAnswer,shown=false){
  if(shown)return {yourAnswer,state:"shown",correct:false,correctAnswer:correctAnswerText(q),explanation:q.explanation||""};
  if(q.sessionType==="term-mc"||q.sessionType==="term-id"){
    const ok=[q.term,...(q.aliases||[])].map(norm).includes(norm(yourAnswer));
    return {yourAnswer,state:ok?"correct":"incorrect",correct:ok,correctAnswer:q.term,explanation:q.explanation||""};
  }
  if(q.sessionType==="enumeration"){
    const ans=Array.isArray(yourAnswer)?yourAnswer:[];
    const expected=q.items||[];
    const matched=expected.filter(item=>ans.some(x=>norm(x)===norm(item))).length;
    const ok=matched===expected.length&&expected.length>0;
    return {yourAnswer:ans,state:ok?"correct":"incorrect",correct:ok,correctAnswer:expected.join(" · "),explanation:q.explanation||"",partial:{matched,total:expected.length}};
  }
  if(q.sessionType==="matching"){
    const vals=yourAnswer||{}; const ok=q.rows.every((r,i)=>vals[i]===r.correct);
    return {yourAnswer:vals,state:ok?"correct":"incorrect",correct:ok,correctAnswer:q.legend.map(p=>`${p.term} → ${p.description}`).join(" · "),explanation:q.explanation||""};
  }
}
function correctAnswerText(q){
  if(q.sessionType.startsWith("term-"))return q.term;
  if(q.sessionType==="enumeration")return q.items.join(" · ");
  return q.legend.map(p=>`${p.term} → ${p.description}`).join(" · ");
}
function yourAnswerText(q,a){
  if(!a)return "(skipped)";
  if(a.state==="shown")return "(shown)";
  if(q.sessionType==="enumeration")return a.yourAnswer?.length?a.yourAnswer.join(" · "):"(blank)";
  if(q.sessionType==="matching"){
    return q.rows.map((r,i)=>`${i+1}:${a.yourAnswer?.[i]||"–"}`).join(" · ");
  }
  return a.yourAnswer||"(blank)";
}

function proportionalSample(m,n){
  const entries=bankEntries(m),total=entries.length;n=Math.min(n,total);
  const bySec=new Map();
  m.sections.forEach(s=>bySec.set(s.id,entries.filter(q=>q.sectionId===s.id)));
  const picks=[];const alloc=[];
  for(const s of m.sections){
    const arr=bySec.get(s.id);if(!arr.length)continue;
    const exact=n*(arr.length/total),base=Math.floor(exact);
    alloc.push({id:s.id,arr,exact,base,frac:exact-base,count:base});
  }
  let used=alloc.reduce((a,x)=>a+x.count,0);
  alloc.sort((a,b)=>b.frac-a.frac);
  let p=0;while(used<n&&alloc.length){if(alloc[p%alloc.length].count<alloc[p%alloc.length].arr.length){alloc[p%alloc.length].count++;used++}p++;if(p>10000)break}
  for(const a of alloc)picks.push(...shuffle(a.arr).slice(0,a.count));
  if(picks.length<n){
    const ids=new Set(picks.map(x=>x.id));
    picks.push(...shuffle(entries.filter(x=>!ids.has(x.id))).slice(0,n-picks.length));
  }
  return shuffle(picks).slice(0,n);
}

async function explainFurther(m,r,i,btn){
  const s=getSettings(),q=r.queue[i],a=r.answers[i],root=$("#exam-review-"+i),out=$(".explain-out",root);
  if(!s.apiKey)return;

  try{
    const sec=m.sections.find(x=>x.id===q.sectionId);
    const prompt=`Explain this missed study question using ONLY the supplied source text. Do not add outside facts. Be concise but clarify why the correct answer fits and why the learner's answer did not.

QUESTION: ${q.sessionType.startsWith("term-")?q.definition:q.prompt}

${sec?.content||""}`;
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":s.apiKey,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:700,messages:[{role:"user",content:prompt}]})});
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const data=await resp.json(),txt=(data.content||[]).map(x=>x.text||"").join("");
    out.innerHTML=`<div class="feedback" style="margin-top:10px">${esc(txt)}</div>`;
  }catch(err){out.innerHTML=`<div class="notice bad" style="margin-top:10px">${esc(err.message)}</div>`}
  btn.disabled=false;btn.textContent="Explain further";
}

function downloadJson(data,name){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0);
}
function exportFullBackup(){
  const settings=getSettings();
  downloadJson({format:"Study Reviewer backup",version:BACKUP_VERSION,exportedAt:new Date().toISOString(),modules:loadModules().map(compactModule),settings:{aiEnabled:settings.aiEnabled},sessions:getSessions()},`study-reviewer-backup-${new Date().toISOString().slice(0,10)}.json`);
}
function chooseBackupRestore(){
  const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
  input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{await restoreFullBackup(JSON.parse(await file.text()))}catch(err){alert("Could not restore backup: "+err.message)}};input.click();
}
async function restoreFullBackup(data){
  if(!data||data.format!=="Study Reviewer backup"||!Array.isArray(data.modules))throw new Error("This is not a valid Study Reviewer full backup.");
  for(const [i,m] of data.modules.entries())if(!m||typeof m.title!=="string"||!Array.isArray(m.sections)||!m.sections.length)throw new Error(`Module ${i+1} is invalid.`);
  if(!confirm(`Replace the current local library with ${data.modules.length} backed-up module${data.modules.length===1?"":"s"}?`))return;
  saveModules(data.modules.map(hydrateModule));
  const current=getSettings();saveSettings({apiKey:current.apiKey,aiEnabled:data.settings?.aiEnabled!==false});
  setSessions(data.sessions&&typeof data.sessions==="object"?data.sessions:{});
  state.quiz=null;state.exam=null;state.quizResults=null;state.examResults=null;$("#modalRoot").innerHTML="";navigate("library");
}

function openSettings(){
  const s=getSettings(),root=$("#modalRoot");
  root.innerHTML=`<div class="modal-backdrop" id="settingsBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="row"><h2>Settings</h2><button class="btn small right" id="closeSettings">✕</button></div>
    <div class="field"><label>Anthropic API key</label><input id="apiKey" type="password" value="${esc(s.apiKey)}" placeholder="sk-ant-…">
      <div class="muted">Stored in this browser's localStorage. Used only for optional bank generation and “Explain further”.</div></div>
    <label class="check-row" style="margin-top:14px"><input type="checkbox" id="aiEnabled" ${s.aiEnabled?"checked":""}> Enable AI-assisted features</label>
    <div class="notice" style="margin-top:14px">Reading, manual authoring, JSON import, quizzes, and practice exams continue to work without an API key once a question bank exists.</div>
    <div class="hr"></div><h3>Backup and restore</h3><p class="muted">Includes modules, banks, scores, exam history, mastery, and unfinished sessions. Your API key is never included.</p>
    <div class="row"><button class="btn" id="exportBackup">Export full backup</button><button class="btn" id="restoreBackup">Restore backup</button></div>
    <div class="row end" style="margin-top:18px"><button class="btn" id="cancelSettings">Cancel</button><button class="btn primary" id="saveSettings">Save settings</button></div>
  </div></div>`;
  $("#closeSettings").onclick=$("#cancelSettings").onclick=()=>root.innerHTML="";
  $("#settingsBackdrop").onclick=e=>{if(e.target.id==="settingsBackdrop")root.innerHTML=""};
  $("#exportBackup").onclick=exportFullBackup;
  $("#restoreBackup").onclick=chooseBackupRestore;
  $("#saveSettings").onclick=()=>{saveSettings({apiKey:$("#apiKey").value.trim(),aiEnabled:$("#aiEnabled").checked});root.innerHTML="";if(state.view==="examResults")render()};
}

window.addEventListener("beforeunload",()=>{if(state.quiz)saveQuizSession();if(state.exam)saveExamSession()});
render();
</script>
</body>
</html>
