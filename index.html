<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Study Reviewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.7.570/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--panel2:#f8fafc;--text:#182230;--muted:#667085;
  --line:#d9e0ea;--primary:#3457d5;--primary2:#2746b6;--good:#138a55;--bad:#c43c3c;
  --warn:#d18a00;--shadow:0 10px 30px rgba(20,32,60,.08);--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1200px;margin:auto;padding:14px 20px;display:flex;gap:12px;align-items:center}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:white;display:grid;place-items:center}
.spacer{flex:1}
.container{max-width:1200px;margin:auto;padding:28px 20px 60px}
.hero{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.hero h1{margin:0 0 7px;font-size:34px;letter-spacing:-1px}
.hero p{margin:0;color:var(--muted)}
.btn{border:1px solid var(--line);background:white;color:var(--text);padding:10px 14px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:#f4f6fb}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary2)}
.btn.danger{color:var(--bad);border-color:#efb5b5}
.btn.good{color:var(--good);border-color:#b8e1cc}
.btn.small{padding:7px 10px;font-size:13px;border-radius:10px}
.btn.link{border:none;background:transparent;padding:7px 2px;color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.module-card{padding:18px;display:flex;flex-direction:column;min-height:260px}
.module-card h3{margin:0 0 7px;font-size:20px}
.muted{color:var(--muted)}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}
.chip.filled{background:#e9edff;border-color:#bdc7ff;color:#3045a3}
.chip.good{background:#e8f7ef;border-color:#b9e7cf;color:var(--good)}
.chip.warn{background:#fff5dc;border-color:#efd7a0;color:#936000}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:42px;min-width:180px;background:white;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);z-index:20}
.menu button{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px}
.menu button:hover{background:#f4f6fb}
.empty{padding:40px;text-align:center;border:1px dashed #b9c2d3;border-radius:var(--radius);background:white}
.empty h3{margin-top:0}
.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;font-weight:800}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:white;color:var(--text)}
textarea{min-height:180px;resize:vertical;line-height:1.45}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{border:0;background:transparent;padding:11px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.notice{padding:12px 14px;border-radius:12px;border:1px solid #d5dded;background:#f6f8fd;color:#42526b}
.notice.good{border-color:#bfe3cf;background:#eefaf3;color:#276a48}
.notice.bad{border-color:#efc2c2;background:#fff2f2;color:#9b3030}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 22px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}
.sidebar{align-self:start;position:sticky;top:82px}
.side-list{display:flex;flex-direction:column;gap:6px}
.side-btn{border:1px solid transparent;background:transparent;padding:10px;border-radius:10px;text-align:left}
.side-btn:hover{background:#f4f6fb}
.side-btn.active{background:#e9edff;border-color:#c8d0ff;color:#253b9c;font-weight:800}
.read-content{line-height:1.75;font-size:16px}
.read-content p{margin:0 0 16px}
.read-content ul{margin-top:0}
.config-list{display:grid;gap:10px}
.radio-row,.check-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.quiz-shell{max-width:920px;margin:auto}
.quiz-head{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}
.quiz-head h2{margin:0}
.score-box{margin-left:auto;text-align:right}
.score-box b{font-size:22px}
.progress-segments{display:grid;gap:4px;margin:12px 0 20px}
.seg{height:7px;border-radius:999px;background:#fff;border:1px solid #cfd6e2}
.seg.current{background:#f2b84b;border-color:#f2b84b}
.seg.correct{background:#36a86f;border-color:#36a86f}
.seg.wrong{background:#d85b5b;border-color:#d85b5b}
.q-card{padding:22px}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.q-format{font-size:13px;color:var(--muted);margin-bottom:18px}
.prompt{font-size:20px;font-weight:800;line-height:1.4;margin-bottom:18px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;background:white}
.choice.correct{border-color:#8fd0ad;background:#effaf4}
.choice.wrong{border-color:#e5a1a1;background:#fff1f1}
.feedback{margin-top:18px;border-left:4px solid var(--primary);background:#f4f6ff;padding:14px 16px;border-radius:10px}
.feedback.good{border-color:var(--good);background:#effaf4}
.feedback.bad{border-color:var(--bad);background:#fff2f2}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.legend-item{border:1px solid var(--line);background:var(--panel2);padding:7px 9px;border-radius:10px}
.match-row{display:grid;grid-template-columns:34px minmax(0,1fr) 110px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf0f5}
.match-row.good{background:#f2fbf6}
.match-row.bad{background:#fff4f4}
.result-hero{text-align:center;padding:30px 20px}
.result-hero .pct{font-size:64px;font-weight:900;letter-spacing:-2px}
.review-item{border-left:5px solid var(--line);padding:14px 16px;margin:12px 0;background:#fff;border-radius:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.review-item.correct{border-left-color:var(--good)}
.review-item.incorrect,.review-item.shown,.review-item.skipped{border-left-color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase}
.exam-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
.exam-side{align-self:start;position:sticky;top:82px}
.timer{font-size:28px;font-weight:900;margin:4px 0 14px}
.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nav-q{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 0;font-size:12px}
.nav-q.answered{background:#e7f7ef;border-color:#acd9c1}
.nav-q.flagged{outline:2px solid #e2ad36}
.nav-q.current{box-shadow:inset 0 0 0 2px var(--primary)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:20px;z-index:100}
.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal h2{margin-top:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.hr{height:1px;background:var(--line);margin:18px 0}
.right{margin-left:auto}
.hidden{display:none!important}
.pre{white-space:pre-wrap}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef1f6;border:1px solid #d7dce7;border-radius:6px;padding:2px 5px;font-size:12px}
@media(max-width:900px){
  .grid{grid-template-columns:1fr 1fr}
  .split,.exam-layout{grid-template-columns:1fr}
  .sidebar,.exam-side{position:static}
  .stat-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .container{padding:20px 14px 44px}
  .topbar-inner{padding:12px 14px}
  .grid{grid-template-columns:1fr}
  .hero{align-items:flex-start;flex-direction:column}
  .form-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .quiz-head{align-items:flex-start;flex-direction:column}
  .score-box{margin-left:0;text-align:left}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="homeBrand" role="button" tabindex="0"><span class="brand-mark">SR</span> Study Reviewer</div>
      <div class="spacer"></div>
      <button class="btn small" id="settingsBtn">⚙ Settings</button>
    </div>
  </header>
  <main id="app" class="container"></main>
</div>
<div id="modalRoot"></div>
<input id="filePicker" type="file" class="hidden" />
<script>
if (typeof pdfjsLib !== "undefined") {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.7.570/pdf.worker.min.js";
}

const LS_MODULES = "studyReviewer.modules.v1";
const LS_SETTINGS = "studyReviewer.settings.v1";

const state = {
  view: "library",
  moduleId: null,
  editId: null,
  editTab: "paste",
  readSectionId: null,
  quizConfig: null,
  quiz: null,
  quizResults: null,
  examConfig: null,
  exam: null,
  examResults: null,
  detailNotice: "",
  authorType: "term",
  importBuffer: null,
  moduleDraftText: "",
  moduleDraftTitle: ""
};

const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const uid = (p="id") => p + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = (v="") => String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = v => String(v ?? "").trim().toLowerCase().replace(/\s+/g," ");
const shuffle = arr => {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
};

function loadModules(){
  try{return JSON.parse(localStorage.getItem(LS_MODULES)||"[]")}catch{return []}
}
function saveModules(mods){localStorage.setItem(LS_MODULES,JSON.stringify(mods))}
function getSettings(){
  const d={apiKey:"",aiEnabled:true};
  try{return {...d,...JSON.parse(localStorage.getItem(LS_SETTINGS)||"{}")}}catch{return d}
}
function saveSettings(s){localStorage.setItem(LS_SETTINGS,JSON.stringify(s))}
function getModule(id){return loadModules().find(m=>m.id===id)}
function updateModule(id, fn){
  const mods=loadModules(); const i=mods.findIndex(m=>m.id===id);
  if(i<0)return null;
  mods[i]=fn(JSON.parse(JSON.stringify(mods[i])))||mods[i]; saveModules(mods); return mods[i];
}
function emptyBank(){return {terms:[],enumerations:[],matching:[]}}
function bankCounts(m){
  const b=m.questionBank||emptyBank();
  return {terms:b.terms?.length||0,enumerations:b.enumerations?.length||0,matching:b.matching?.length||0,
    total:(b.terms?.length||0)+(b.enumerations?.length||0)+(b.matching?.length||0)};
}
function bankEntries(m){
  const b=m.questionBank||emptyBank();
  return [
    ...(b.terms||[]).map(q=>({...q,baseType:"term"})),
    ...(b.enumerations||[]).map(q=>({...q,baseType:"enumeration"})),
    ...(b.matching||[]).map(q=>({...q,baseType:"matching"}))
  ];
}
function sectionTitle(m,id){return m.sections.find(s=>s.id===id)?.title||"Unassigned"}
function bestExam(m){
  if(!m.examHistory?.length)return null;
  return [...m.examHistory].sort((a,b)=>b.percentage-a.percentage)[0];
}
function fmtDate(d){try{return new Date(d).toLocaleString()}catch{return d}}
function scoreBand(p){
  if(p<40)return "Review the handout first.";
  if(p<70)return "Getting there — retry what you missed.";
  if(p<90)return "Solid grasp.";
  return "You know this cold.";
}
function navigate(view, moduleId=null){
  clearExamTimer();
  Object.assign(state,{view,moduleId});
  window.scrollTo({top:0,behavior:"instant"});
  render();
}
function clearExamTimer(){
  if(state.exam?.timerHandle){clearInterval(state.exam.timerHandle);state.exam.timerHandle=null}
}

$("#homeBrand").onclick=()=>navigate("library");
$("#settingsBtn").onclick=openSettings;
$("#homeBrand").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")navigate("library")};

function render(){
  const app=$("#app");
  if(state.view==="library") renderLibrary(app);
  else if(state.view==="edit") renderEdit(app);
  else if(state.view==="detail") renderDetail(app);
  else if(state.view==="read") renderRead(app);
  else if(state.view==="quizConfig") renderQuizConfig(app);
  else if(state.view==="quiz") renderQuiz(app);
  else if(state.view==="quizResults") renderQuizResults(app);
  else if(state.view==="examConfig") renderExamConfig(app);
  else if(state.view==="exam") renderExam(app);
  else if(state.view==="examResults") renderExamResults(app);
}

function renderLibrary(app){
  const mods=loadModules();
  app.innerHTML=`
    <section class="hero">
      <div><h1>Your study library</h1><p>Read your material, drill it casually, or simulate exam conditions.</p></div>
      <button class="btn primary" id="newModuleBtn">＋ New module</button>
    </section>
    ${mods.length?`<div class="grid">${mods.map(moduleCard).join("")}</div>`:
      `<div class="empty"><h3>No modules yet</h3><p class="muted">Create one from pasted text, a file, or JSON.</p><button class="btn primary" id="emptyNewBtn">＋ New module</button></div>`}
  `;
  $("#newModuleBtn")?.addEventListener("click",()=>startEdit());
  $("#emptyNewBtn")?.addEventListener("click",()=>startEdit());
  $$("[data-action=read]").forEach(b=>b.onclick=()=>{state.readSectionId=null;navigate("read",b.dataset.id)});
  $$("[data-action=quiz]").forEach(b=>b.onclick=()=>navigate("quizConfig",b.dataset.id));
  $$("[data-action=exam]").forEach(b=>b.onclick=()=>navigate("examConfig",b.dataset.id));
  $$("[data-menu]").forEach(b=>b.onclick=e=>toggleMenu(e,b.dataset.menu));
  $$("[data-action=edit]").forEach(b=>b.onclick=()=>startEdit(b.dataset.id));
  $$("[data-action=export]").forEach(b=>b.onclick=()=>exportModule(b.dataset.id));
  $$("[data-action=delete]").forEach(b=>b.onclick=()=>deleteModule(b.dataset.id));
  $$("[data-title]").forEach(b=>b.onclick=()=>navigate("detail",b.dataset.title));
}
function moduleCard(m){
  const c=bankCounts(m), best=bestExam(m);
  return `<article class="card module-card">
    <div class="row"><h3 data-title="${m.id}" style="cursor:pointer">${esc(m.title)}</h3>
      <div class="right menu-wrap">
        <button class="btn small" data-menu="${m.id}" aria-label="More options">⋮</button>
        <div class="menu hidden" id="menu-${m.id}">
          <button data-action="edit" data-id="${m.id}">✏️ Edit</button>
          <button data-action="export" data-id="${m.id}">⬇ Export as JSON</button>
          <button data-action="delete" data-id="${m.id}" style="color:var(--bad)">🗑 Delete</button>
        </div>
      </div>
    </div>
    <div class="muted">${m.sections.length} section${m.sections.length===1?"":"s"}</div>
    <div class="meta-row">
      <span class="chip">Terms ${c.terms}</span><span class="chip">Enumerations ${c.enumerations}</span><span class="chip">Matching ${c.matching}</span>
    </div>
    <div class="notice ${best?"good":""}" style="margin-bottom:14px">
      ${best?`Best practice exam: <b>${best.percentage}%</b> (${best.correct}/${best.totalQuestions})`:"No practice exam attempts yet."}
    </div>
    <div class="actions">
      <button class="btn small" data-action="read" data-id="${m.id}">📖 Read</button>
      <button class="btn small" data-action="quiz" data-id="${m.id}">📝 Quiz</button>
      <button class="btn primary small" data-action="exam" data-id="${m.id}">🎯 Practice Exam</button>
    </div>
  </article>`;
}
function toggleMenu(e,id){
  e.stopPropagation();
  const target=$("#menu-"+CSS.escape(id));
  $$(".menu").forEach(m=>{if(m!==target)m.classList.add("hidden")});
  target?.classList.toggle("hidden");
}
document.addEventListener("click",()=>$$(".menu").forEach(m=>m.classList.add("hidden")));

function startEdit(id=null){
  state.editId=id; state.editTab="paste"; state.importBuffer=null;
  const m=id?getModule(id):null;
  state.moduleDraftTitle=m?.title||"";
  state.moduleDraftText=m?sectionsToText(m):"";
  navigate("edit",id);
}
function sectionsToText(m){
  if(m.sections.length===1 && m.sections[0].title===m.title) return m.sections[0].content;
  return m.sections.map(s=>`## ${s.title}\n${s.content}`).join("\n\n");
}
function renderEdit(app){
  const isEdit=!!state.editId;
  app.innerHTML=`
    <section class="hero"><div><h1>${isEdit?"Edit module":"New module"}</h1><p>Use one of the three input paths below.</p></div>
      <button class="btn" id="cancelEdit">← Library</button></section>
    <div class="panel">
      <div class="field" style="margin-bottom:16px"><label>Module title</label><input id="moduleTitle" type="text" value="${esc(state.moduleDraftTitle)}" placeholder="e.g. Risk Management"></div>
      <div class="tabs">
        ${tabBtn("paste","Paste text")}${tabBtn("upload","Upload file")}${tabBtn("json","Import JSON")}
      </div>
      <div id="editTabBody"></div>
      <div class="row end" style="margin-top:18px">
        <button class="btn" id="cancelEdit2">Cancel</button>
        <button class="btn primary" id="saveModuleBtn">${isEdit?"Save changes":"Create module"}</button>
      </div>
    </div>`;
  $("#cancelEdit").onclick=$("#cancelEdit2").onclick=()=>navigate("library");
  $("#moduleTitle").oninput=e=>state.moduleDraftTitle=e.target.value;
  $$(".tab").forEach(b=>b.onclick=()=>{state.editTab=b.dataset.tab;render()});
  $("#saveModuleBtn").onclick=saveModuleFromEditor;
  renderEditTab();
}
function tabBtn(k,label){return `<button class="tab ${state.editTab===k?"active":""}" data-tab="${k}">${label}</button>`}
function renderEditTab(){
  const body=$("#editTabBody");
  if(state.editTab==="paste"){
    body.innerHTML=`<div class="field"><label>Study material</label><textarea id="sourceText" placeholder="Paste text here. Start a section with: ## Section title">${esc(state.moduleDraftText)}</textarea>
      <div class="muted">A line beginning with <span class="kbd">## </span> starts a new section. Text before the first heading becomes a section named after the module.</div></div>`;
    $("#sourceText").oninput=e=>state.moduleDraftText=e.target.value;
  } else if(state.editTab==="upload"){
    body.innerHTML=`<div class="notice">Accepted: <b>.txt, .docx, .pdf, .zip</b>, or an <b>entire folder</b>. Folder/ZIP imports turn supported files into separate sections.</div>
      <div class="form-grid" style="margin:14px 0">
        <div class="field"><label>Upload file / ZIP</label><input type="file" id="studyFile" accept=".txt,.docx,.pdf,.zip"></div>
        <div class="field"><label>Upload folder</label><input type="file" id="studyFolder" webkitdirectory directory multiple></div>
      </div>
      <div id="fileStatus" class="muted" style="margin-bottom:12px"></div>
      <div class="field"><label>Extracted text</label><textarea id="sourceText">${esc(state.moduleDraftText)}</textarea></div>`;
    $("#sourceText").oninput=e=>state.moduleDraftText=e.target.value;
    $("#studyFile").onchange=handleStudyFile;
    $("#studyFolder").onchange=handleStudyFolder;
  } else {
    body.innerHTML=`<div class="notice">Import either <span class="kbd">{ title, sections }</span> or <span class="kbd">{ title, sections, questionBank }</span>.</div>
      <div class="row" style="margin:14px 0"><input type="file" id="jsonFile" accept=".json"><span id="jsonStatus" class="muted"></span></div>
      <div class="field"><label>JSON</label><textarea id="jsonText" placeholder='{"title":"...","sections":[...]}'></textarea></div>
      <div id="jsonValidation"></div>`;
    $("#jsonText").oninput=e=>validateImportText(e.target.value,true);
    $("#jsonFile").onchange=async e=>{
      const f=e.target.files?.[0]; if(!f)return;
      const txt=await f.text(); $("#jsonText").value=txt; validateImportText(txt,true);
    };

}
async function extractDocxText(arrayBuffer){
  if(typeof mammoth==="undefined")throw new Error("The .docx reader didn't load (internet is required for the parser library). Try again once you're online, or paste the text instead.");
  let r;
  if(typeof mammoth.extractRawText==="function") r=await mammoth.extractRawText({arrayBuffer});
  else if(typeof mammoth.convertToRawText==="function") r=await mammoth.convertToRawText({arrayBuffer});
  else throw new Error("The loaded Mammoth library does not expose a DOCX raw-text extractor.");
  return r?.value||"";
}

async function extractTextFromFile(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(ext==="txt") return await file.text();
  if(ext==="docx"){
    const ab=await file.arrayBuffer();
    return await extractDocxText(ab);
  }
  if(ext==="pdf"){
    if(typeof pdfjsLib==="undefined")throw new Error("The .pdf reader didn't load (internet is required for the parser library). Try again once you're online, or paste the text instead.");
    const ab=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise, pages=[];
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p), tc=await page.getTextContent();
      pages.push(tc.items.map(i=>i.str).join(" "));
    }
    return pages.join("\n\n");
  }
  throw new Error("Unsupported file type.");
}

function sectionTitleFromPath(path){
  return String(path||"Untitled section")
    .replace(/\\/g,"/")
    .replace(/^[^/]+\//,"")
    .replace(/\.(txt|docx|pdf)$/i,"")
    .replace(/\//g," / ")
    .trim() || "Untitled section";
}

function setImportedSections(parts, fallbackTitle=""){
  const valid=parts.filter(x=>x && x.text && x.text.trim());
  if(!valid.length)throw new Error("No readable .txt, .docx, or .pdf files were found.");
  state.moduleDraftText=valid.map(x=>`## ${x.title}\n${x.text.trim()}`).join("\n\n");
  const ta=$("#sourceText"); if(ta)ta.value=state.moduleDraftText;
  if(!state.moduleDraftTitle.trim() && fallbackTitle){
    state.moduleDraftTitle=fallbackTitle;
    const titleInput=$("#moduleTitle"); if(titleInput)titleInput.value=fallbackTitle;
  }
  return valid.length;
}

async function handleStudyFile(e){
  const f=e.target.files?.[0]; if(!f)return;
  const st=$("#fileStatus"); st.textContent="Reading…";
  try{
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    if(ext==="zip"){
      if(typeof JSZip==="undefined")throw new Error("The ZIP reader didn't load (internet is required for the parser library). Try again once you're online.");
      const zip=await JSZip.loadAsync(await f.arrayBuffer());
      const entries=Object.values(zip.files).filter(x=>!x.dir && /\.(txt|docx|pdf)$/i.test(x.name));
      const parts=[]; let skipped=0;
      for(const entry of entries){
        try{
          const ext=(entry.name.split(".").pop()||"").toLowerCase();
          let text="";
          if(ext==="txt") text=await entry.async("string");
          else if(ext==="docx"){
            const ab=await entry.async("arraybuffer");
            text=await extractDocxText(ab);
          }else if(ext==="pdf"){
            if(typeof pdfjsLib==="undefined")throw new Error("PDF parser unavailable");
            const ab=await entry.async("arraybuffer");
            const pdf=await pdfjsLib.getDocument({data:ab}).promise, pages=[];
            for(let p=1;p<=pdf.numPages;p++){
              const page=await pdf.getPage(p), tc=await page.getTextContent();
              pages.push(tc.items.map(i=>i.str).join(" "));
            }
            text=pages.join("\n\n");
          }
          if(text.trim())parts.push({title:sectionTitleFromPath(entry.name),text}); else skipped++;
        }catch{skipped++}
      }
      const count=setImportedSections(parts,f.name.replace(/\.zip$/i,""));
      st.textContent=`Loaded ${count} supported file${count===1?"":"s"} from ${f.name}${skipped?` · skipped ${skipped}`:""}.`;
    }else{
      const text=await extractTextFromFile(f);
      state.moduleDraftText=text;
      $("#sourceText").value=text;
      if(!state.moduleDraftTitle.trim()){
        state.moduleDraftTitle=f.name.replace(/\.(txt|docx|pdf)$/i,"");
        $("#moduleTitle").value=state.moduleDraftTitle;
      }
      st.textContent=`Loaded ${f.name}`;
    }
  }catch(err){st.textContent="Could not read file: "+err.message}
}

async function handleStudyFolder(e){
  const files=[...(e.target.files||[])]; if(!files.length)return;
  const st=$("#fileStatus");
  const supported=files.filter(f=>/\.(txt|docx|pdf)$/i.test(f.name));
  if(!supported.length){st.textContent="No supported .txt, .docx, or .pdf files were found in that folder.";return}
  st.textContent=`Reading 0/${supported.length} supported files…`;
  const parts=[]; let failed=0; const failures=[];
  for(let i=0;i<supported.length;i++){
    const f=supported[i];
    const displayPath=f.webkitRelativePath||f.name;
    st.textContent=`Reading ${i+1}/${supported.length}: ${displayPath}`;
    try{
      const text=await extractTextFromFile(f);
      if(text.trim())parts.push({title:sectionTitleFromPath(displayPath),text});
      else {failed++;failures.push(`${displayPath}: no extractable text`)}
    }catch(err){failed++;failures.push(`${displayPath}: ${err.message}`)}
  }
  try{
    const root=(supported[0].webkitRelativePath||"").split("/")[0]||"Imported folder";
    const count=setImportedSections(parts,root);
    st.textContent=`Loaded ${count} supported file${count===1?"":"s"} from folder${failed?` · ${failed} could not be read`:""}.`;
  }catch(err){
    const detail=failures.length?` First error: ${failures[0]}`:"";
    st.textContent="Could not import folder: "+err.message+detail;
  }
}

function validateImportText(txt,show=false){
  const out=$("#jsonValidation");
  try{
    const obj=JSON.parse(txt);
    const errs=[];
    if(!obj||typeof obj!=="object")errs.push("Root must be an object.");
    if(!obj.title||typeof obj.title!=="string")errs.push("Missing string field: title.");
    if(!Array.isArray(obj.sections)||!obj.sections.length)errs.push("sections must be a non-empty array.");
    else obj.sections.forEach((s,i)=>{
      if(!s||typeof s.title!=="string"||typeof s.content!=="string")errs.push(`Section ${i+1} needs string title and content.`);
    });
    if(obj.questionBank){
      for(const k of ["terms","enumerations","matching"]) if(!Array.isArray(obj.questionBank[k])) errs.push(`questionBank.${k} must be an array.`);
    }
    if(errs.length)throw new Error(errs.join(" "));
    state.importBuffer=obj;
    if(show&&out)out.innerHTML=`<div class="notice good" style="margin-top:12px">Valid import: ${obj.sections.length} section(s)${obj.questionBank?" with question bank":""}.</div>`;
    return obj;
  }catch(err){
    state.importBuffer=null;
    if(show&&out)out.innerHTML=`<div class="notice bad" style="margin-top:12px">${esc(err.message)}</div>`;
    return null;
  }
}
function parseSections(title,text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  const sections=[]; let cur={title:title||"Untitled module",lines:[]};
  let sawHeading=false;
  for(const line of lines){
    if(line.startsWith("## ")){
      if(cur.lines.join("\n").trim()||sawHeading)sections.push({id:uid("sec"),title:cur.title,content:cur.lines.join("\n").trim()});
      sawHeading=true; cur={title:line.slice(3).trim()||"Untitled section",lines:[]};
    }else cur.lines.push(line);
  }
  if(cur.lines.join("\n").trim()||!sections.length)sections.push({id:uid("sec"),title:cur.title,content:cur.lines.join("\n").trim()});
  return sections.filter(s=>s.content||sections.length===1);
}
function normalizeImportedModule(obj,id=null){
  const sections=obj.sections.map(s=>({id:s.id||uid("sec"),title:s.title,content:s.content}));
  const validSecIds=new Set(sections.map(s=>s.id));
  const bank=emptyBank();
  if(obj.questionBank){
    bank.terms=(obj.questionBank.terms||[]).map(q=>({...q,id:q.id||uid("q"),sectionId:validSecIds.has(q.sectionId)?q.sectionId:(sections[0]?.id||null),concept:q.concept||"General",explanation:q.explanation||""}));
    bank.enumerations=(obj.questionBank.enumerations||[]).map(q=>({...q,id:q.id||uid("q"),sectionId:validSecIds.has(q.sectionId)?q.sectionId:(sections[0]?.id||null),concept:q.concept||"General",items:Array.isArray(q.items)?q.items:[],explanation:q.explanation||""}));
    bank.matching=(obj.questionBank.matching||[]).map(q=>({...q,id:q.id||uid("q"),sectionId:validSecIds.has(q.sectionId)?q.sectionId:(sections[0]?.id||null),concept:q.concept||"General",pairs:Array.isArray(q.pairs)?q.pairs:[],explanation:q.explanation||""}));
  }
  return {id:id||uid("mod"),title:obj.title.trim(),sections,questionBank:bank,quizScores:obj.quizScores||{},examHistory:obj.examHistory||[],createdAt:obj.createdAt||new Date().toISOString()};
}
function saveModuleFromEditor(){
  const title=state.moduleDraftTitle.trim()||$("#moduleTitle")?.value.trim();
  if(state.editTab==="json"){
    const obj=state.importBuffer||validateImportText($("#jsonText")?.value||"",true);
    if(!obj)return;
    const existing=state.editId?getModule(state.editId):null;
    const normalized=normalizeImportedModule(obj,state.editId||null);
    if(existing){normalized.quizScores=existing.quizScores||{};normalized.examHistory=existing.examHistory||[];normalized.createdAt=existing.createdAt}
    persistOne(normalized);
    navigate("detail",normalized.id); return;
  }
  if(!title){alert("Enter a module title.");return}
  if(!state.moduleDraftText.trim()){alert("Add some study material.");return}
  const existing=state.editId?getModule(state.editId):null;
  const sections=parseSections(title,state.moduleDraftText);
  const remap=new Map();
  if(existing){
    // Preserve IDs for unchanged section titles when possible.
    for(const s of sections){
      const old=existing.sections.find(x=>x.title===s.title);
      if(old){remap.set(s.id,old.id);s.id=old.id}
    }
  }
  const mod={
    id:state.editId||uid("mod"),title,sections,
    questionBank:existing?.questionBank||emptyBank(),
    quizScores:existing?.quizScores||{},
    examHistory:existing?.examHistory||[],
    createdAt:existing?.createdAt||new Date().toISOString()
  };
  // Remove questions whose section was deleted.
  const ids=new Set(sections.map(s=>s.id));
  for(const k of ["terms","enumerations","matching"])mod.questionBank[k]=(mod.questionBank[k]||[]).filter(q=>ids.has(q.sectionId));
  persistOne(mod); navigate("detail",mod.id);
}
function persistOne(mod){
  const mods=loadModules(), i=mods.findIndex(x=>x.id===mod.id);
  if(i>=0)mods[i]=mod; else mods.unshift(mod);
  saveModules(mods);
}

async function generateBankAI(moduleId){

{"terms":[{"term":"...","definition":"...","concept":"...","explanation":"..."}],

TEXT:
${sec.content}`;

function formatRead(text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  let out="",inUl=false,para=[];
  const flushP=()=>{if(para.length){out+=`<p>${esc(para.join(" "))}</p>`;para=[]}};
  const closeUl=()=>{if(inUl){out+="</ul>";inUl=false}};
  for(const line of lines){
    if(line.startsWith("- ")){flushP();if(!inUl){out+="<ul>";inUl=true}out+=`<li>${esc(line.slice(2))}</li>`}
    else if(!line.trim()){flushP();closeUl()}
    else {closeUl();para.push(line.trim())}
  }
  flushP();closeUl();return out||"<p class='muted'>No content.</p>";
}

function eligibleQuizEntries(m,cfg){
  const src=q=>cfg.source==="all"||q.sectionId===cfg.source;
  const arr=[];
  if(cfg.termMode!=="skip")for(const q of (m.questionBank.terms||[]).filter(src))arr.push({...q,baseType:"term"});
  if(cfg.enumeration)for(const q of (m.questionBank.enumerations||[]).filter(src))arr.push({...q,baseType:"enumeration"});
  if(cfg.matching)for(const q of (m.questionBank.matching||[]).filter(src))arr.push({...q,baseType:"matching"});
  return arr;
}
function updateQuizAvail(m){const n=eligibleQuizEntries(m,state.quizConfig).length;$("#quizAvailability").textContent=`${n} bank item${n===1?"":"s"} available with this configuration.`}
function makeSessionQuestion(base,m,termMode="mix"){
  if(base.baseType==="term"){
    const format=termMode==="mix"?(Math.random()<.5?"mc":"id"):termMode;
    let choices=[];
    if(format==="mc"){
      const pool=(m.questionBank.terms||[]).filter(x=>x.id!==base.id).map(x=>x.term);
      choices=shuffle([base.term,...shuffle([...new Set(pool)]).slice(0,3)]);
      while(choices.length<4)choices.push("—");
    }
    return {...base,sessionType:format==="mc"?"term-mc":"term-id",choices};
  }
  if(base.baseType==="matching"){
    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const legend=base.pairs.map((p,i)=>({...p,letter:letters[i]}));
    return {...base,sessionType:"matching",legend,rows:shuffle(legend.map(p=>({description:p.description,correct:p.letter,term:p.term})))};
  }
  return {...base,sessionType:"enumeration"};
}
function startQuiz(m,cfg,forcedBase=null){
  let base=forcedBase||shuffle(eligibleQuizEntries(m,cfg));
  if(!base.length)return alert("No questions match this configuration.");
  const requested=cfg.length==="all"?base.length:Number(cfg.length);
  base=base.slice(0,Math.min(requested,base.length));
  const queue=base.map(q=>makeSessionQuestion(q,m,cfg.termMode));
  state.quiz={moduleId:m.id,cfg:{...cfg},queue,index:0,answers:queue.map(()=>null),score:0,startedAt:new Date().toISOString(),sourceKey:cfg.source,lengthKey:cfg.length};
  state.quizResults=null; navigate("quiz",m.id);
}

function collectAnswer(q){
  if(q.sessionType==="term-mc")return $('input[name="mc"]:checked')?.value||"";

  if(q.sessionType==="enumeration")return ($("#enumAnswer")?.value||"").split("\n").map(x=>x.trim()).filter(Boolean);

function gradeAnswer(q,yourAnswer,shown=false){
  if(shown)return {yourAnswer,state:"shown",correct:false,correctAnswer:correctAnswerText(q),explanation:q.explanation||""};
  if(q.sessionType==="term-mc"||q.sessionType==="term-id"){
    const ok=norm(yourAnswer)===norm(q.term);
    return {yourAnswer,state:ok?"correct":"incorrect",correct:ok,correctAnswer:q.term,explanation:q.explanation||""};
  }
  if(q.sessionType==="enumeration"){
    const ans=Array.isArray(yourAnswer)?yourAnswer:[];
    const expected=q.items||[];
    const matched=expected.filter(item=>ans.some(x=>norm(x)===norm(item))).length;
    const ok=matched===expected.length&&expected.length>0;
    return {yourAnswer:ans,state:ok?"correct":"incorrect",correct:ok,correctAnswer:expected.join(" · "),explanation:q.explanation||"",partial:{matched,total:expected.length}};
  }
  if(q.sessionType==="matching"){
    const vals=yourAnswer||{}; const ok=q.rows.every((r,i)=>vals[i]===r.correct);
    return {yourAnswer:vals,state:ok?"correct":"incorrect",correct:ok,correctAnswer:q.legend.map(p=>`${p.term} → ${p.description}`).join(" · "),explanation:q.explanation||""};
  }
}
function correctAnswerText(q){
  if(q.sessionType.startsWith("term-"))return q.term;
  if(q.sessionType==="enumeration")return q.items.join(" · ");
  return q.legend.map(p=>`${p.term} → ${p.description}`).join(" · ");
}
function yourAnswerText(q,a){
  if(!a)return "(skipped)";
  if(a.state==="shown")return "(shown)";
  if(q.sessionType==="enumeration")return a.yourAnswer?.length?a.yourAnswer.join(" · "):"(blank)";
  if(q.sessionType==="matching"){
    return q.rows.map((r,i)=>`${i+1}:${a.yourAnswer?.[i]||"–"}`).join(" · ");
  }
  return a.yourAnswer||"(blank)";
}

function proportionalSample(m,n){
  const entries=bankEntries(m),total=entries.length;n=Math.min(n,total);
  const bySec=new Map();
  m.sections.forEach(s=>bySec.set(s.id,entries.filter(q=>q.sectionId===s.id)));
  const picks=[];const alloc=[];
  for(const s of m.sections){
    const arr=bySec.get(s.id);if(!arr.length)continue;
    const exact=n*(arr.length/total),base=Math.floor(exact);
    alloc.push({id:s.id,arr,exact,base,frac:exact-base,count:base});
  }
  let used=alloc.reduce((a,x)=>a+x.count,0);
  alloc.sort((a,b)=>b.frac-a.frac);
  let p=0;while(used<n&&alloc.length){if(alloc[p%alloc.length].count<alloc[p%alloc.length].arr.length){alloc[p%alloc.length].count++;used++}p++;if(p>10000)break}
  for(const a of alloc)picks.push(...shuffle(a.arr).slice(0,a.count));
  if(picks.length<n){
    const ids=new Set(picks.map(x=>x.id));
    picks.push(...shuffle(entries.filter(x=>!ids.has(x.id))).slice(0,n-picks.length));
  }
  return shuffle(picks).slice(0,n);
}
function startExam(m,cfg){
  const available=bankCounts(m).total,requested=cfg.length==="all"?available:Number(cfg.length),bases=proportionalSample(m,Math.min(requested,available));
  const queue=bases.map(q=>makeSessionQuestion(q,m,"mix"));
  const durationMs=cfg.timer?Math.round(queue.length*cfg.minutesPerQuestion*60*1000):null;
  state.exam={moduleId:m.id,cfg:{...cfg},queue,index:0,answers:queue.map(()=>null),flags:queue.map(()=>false),startedAt:Date.now(),durationMs,remainingMs:durationMs,timerHandle:null};
  state.examResults=null;
  state.view="exam";state.moduleId=m.id;render();startExamTimer();
}
function startExamTimer(){
  const ex=state.exam;if(!ex?.cfg.timer)return;
  clearExamTimer();
  const end=Date.now()+ex.remainingMs;
  ex.timerHandle=setInterval(()=>{
    ex.remainingMs=Math.max(0,end-Date.now());
    const t=$("#examTimer");if(t)t.textContent=formatTime(ex.remainingMs);
    if(ex.remainingMs<=0){clearExamTimer();finishExam(true)}
  },500);
}
function formatTime(ms){const s=Math.ceil(ms/1000),m=Math.floor(s/60),r=s%60;return `${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`}
function renderExam(app){
  const ex=state.exam,m=getModule(ex?.moduleId);if(!ex||!m)return navigate("examConfig",state.moduleId);
  const i=ex.index,q=ex.queue[i],ans=ex.answers[i];
  app.innerHTML=`
    <section class="hero"><div><div class="muted">Practice Exam</div><h1>${esc(m.title)}</h1></div><button class="btn danger" id="submitExam">Submit exam</button></section>
    <div class="exam-layout">
      <aside class="panel exam-side">
        ${ex.cfg.timer?`<div class="muted">TIME LEFT</div><div class="timer" id="examTimer">${formatTime(ex.remainingMs)}</div>`:"<div class='muted'>Timer off</div>"}
        <div class="row"><b>Navigator</b><span class="chip">${ex.answers.filter(Boolean).length}/${ex.queue.length}</span></div>
        <div class="nav-grid" style="margin-top:10px">${ex.queue.map((_,idx)=>`<button class="nav-q ${ex.answers[idx]?"answered":""} ${ex.flags[idx]?"flagged":""} ${idx===i?"current":""}" data-jump="${idx}">${idx+1}</button>`).join("")}</div>
      </aside>
      <div>
        <div class="card q-card">
          ${renderQuestionHeader(m,q,false)}
          ${renderQuestionBody(q,ans,true)}
          <div class="row" style="margin-top:18px">
            <label class="check-row" style="padding:8px 10px"><input type="checkbox" id="flagQ" ${ex.flags[i]?"checked":""}> Flag for review</label>
            <button class="btn right" id="prevExam" ${i===0?"disabled":""}>← Previous</button>
            <button class="btn primary" id="nextExam">${i===ex.queue.length-1?"Review / submit":"Next →"}</button>
          </div>
        </div>
      </div>
    </div>`;
  restoreExamInput(q,ans);
  const save=()=>saveExamCurrent();
  ["change","input"].forEach(ev=>$("#app").addEventListener(ev,e=>{if(e.target.matches('input[name="mc"],#idAnswer,#enumAnswer,.matchSelect'))save()},{once:false}));
  $("#flagQ").onchange=e=>{ex.flags[i]=e.target.checked;render();startExamTimer()};
  $$("[data-jump]").forEach(b=>b.onclick=()=>{saveExamCurrent();ex.index=Number(b.dataset.jump);render();startExamTimer()});
  $("#prevExam").onclick=()=>{saveExamCurrent();if(i>0){ex.index--;render();startExamTimer()}};
  $("#nextExam").onclick=()=>{saveExamCurrent();if(i<ex.queue.length-1){ex.index++;render();startExamTimer()}else submitExamPrompt()};
  $("#submitExam").onclick=()=>{saveExamCurrent();submitExamPrompt()};
}
function restoreExamInput(){}
function saveExamCurrent(){
  const ex=state.exam;if(!ex)return;const q=ex.queue[ex.index],val=collectAnswer(q);
  const isBlank=q.sessionType==="matching"?Object.values(val).every(v=>!v):Array.isArray(val)?val.length===0:!String(val).trim();
  ex.answers[ex.index]=isBlank?null:{yourAnswer:val};
}
function submitExamPrompt(){
  const ex=state.exam,unanswered=ex.answers.filter(a=>!a).length;
  if(unanswered&&!confirm(`${unanswered} unanswered — submit anyway?`))return;
  if(!unanswered&&!confirm("Submit this practice exam? Answers will be graded now."))return;
  finishExam(false);
}
function finishExam(auto){
  const ex=state.exam,m=getModule(ex.moduleId);clearExamTimer();
  const graded=ex.queue.map((q,i)=>{
    if(!ex.answers[i])return {yourAnswer:"",state:"skipped",correct:false,correctAnswer:correctAnswerText(q),explanation:q.explanation||""};
    return gradeAnswer(q,ex.answers[i].yourAnswer,false);
  });
  const correct=graded.filter(a=>a.correct).length,total=graded.length,pct=Math.round(correct/total*100),passed=pct>=ex.cfg.passing;
  const breakdown=m.sections.map(s=>{
    const inds=ex.queue.map((q,i)=>q.sectionId===s.id?i:-1).filter(i=>i>=0);
    return {sectionTitle:s.title,correct:inds.filter(i=>graded[i].correct).length,total:inds.length};
  }).filter(x=>x.total);
  const attempt={id:uid("exam"),date:new Date().toISOString(),totalQuestions:total,correct,percentage:pct,passed,sectionBreakdown:breakdown,
    answers:ex.queue.map((q,i)=>({questionId:q.id,type:q.sessionType,yourAnswer:graded[i].yourAnswer,correctAnswer:graded[i].correctAnswer,state:graded[i].state,explanation:graded[i].explanation}))};
  updateModule(m.id,x=>{x.examHistory=x.examHistory||[];x.examHistory.unshift(attempt);return x});
  state.examResults={...attempt,queue:ex.queue,answers:graded,passing:ex.cfg.passing,autoSubmitted:auto};
  state.view="examResults";state.moduleId=m.id;render();
}
function renderExamResults(app){
  const r=state.examResults,m=getModule(state.moduleId);if(!r||!m)return navigate("examConfig",state.moduleId);
  app.innerHTML=`
    <section class="hero"><div><div class="muted">Practice Exam results</div><h1>${esc(m.title)}</h1></div></section>
    ${r.autoSubmitted?`<div class="notice bad" style="margin-bottom:16px">Time expired. The exam was submitted automatically.</div>`:""}
    <div class="panel result-hero"><div class="pct">${r.percentage}%</div><h2>${r.correct} of ${r.totalQuestions}</h2>
      <div class="chip ${r.passed?"good":"warn"}" style="font-size:14px">${r.passed?"PASS":"FAIL"} · threshold ${r.passing}%</div></div>
    <div class="panel" style="margin-top:18px"><h2>Section breakdown</h2>
      <table><thead><tr><th>Section</th><th>Correct</th><th>Total</th></tr></thead><tbody>${r.sectionBreakdown.map(x=>`<tr><td>${esc(x.sectionTitle)}</td><td>${x.correct}</td><td>${x.total}</td></tr>`).join("")}</tbody></table></div>
    <div class="panel" style="margin-top:18px"><h2>Answer key</h2>${renderExamReview(m,r)}</div>
    <div class="row" style="margin-top:18px"><button class="btn" id="newExam">New practice exam</button><button class="btn primary right" id="backModule">Back to module</button></div>`;
  $("#newExam").onclick=()=>navigate("examConfig",m.id);
  $("#backModule").onclick=()=>navigate("detail",m.id);
  $$("[data-explain]").forEach(b=>b.onclick=()=>explainFurther(m,r,Number(b.dataset.explain),b));
}
function renderExamReview(m,r){
  const settings=getSettings();
  return r.queue.map((q,i)=>{
    const a=r.answers[i],can=settings.aiEnabled&&settings.apiKey&&a.state!=="correct";
    return `<div class="review-item ${a.state}" id="exam-review-${i}">
      <div class="tags"><span class="chip filled">${esc(sectionTitle(m,q.sectionId))}</span><span class="chip">${esc(typeLabel(q.sessionType))}</span><span class="chip">${esc(q.concept||"General")}</span></div>
      <b>${i+1}. ${esc(q.sessionType.startsWith("term-")?q.definition:q.prompt)}</b>
      <div style="margin-top:8px"><b>Correct:</b> ${esc(a.correctAnswer)}</div><div><b>You put:</b> ${esc(yourAnswerText(q,a))}</div>
      ${a.explanation?`<div class="muted" style="margin-top:7px">${esc(a.explanation)}</div>`:""}
      ${can?`<button class="btn small" data-explain="${i}" style="margin-top:10px">✨ Explain further</button><div class="explain-out"></div>`:""}
    </div>`;
  }).join("");
}
async function explainFurther(m,r,i,btn){
  const s=getSettings(),q=r.queue[i],a=r.answers[i],root=$("#exam-review-"+i),out=$(".explain-out",root);
  if(!s.apiKey)return;
  btn.disabled=true;btn.textContent="Explaining…";
  try{
    const sec=m.sections.find(x=>x.id===q.sectionId);
    const prompt=`Explain this missed study question using ONLY the supplied source text. Do not add outside facts. Be concise but clarify why the correct answer fits and why the learner's answer did not.

QUESTION: ${q.sessionType.startsWith("term-")?q.definition:q.prompt}
LEARNER ANSWER: ${yourAnswerText(q,a)}
CORRECT ANSWER: ${a.correctAnswer}
SOURCE TEXT:
${sec?.content||""}`;
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":s.apiKey,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:700,messages:[{role:"user",content:prompt}]})});
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const data=await resp.json(),txt=(data.content||[]).map(x=>x.text||"").join("");
    out.innerHTML=`<div class="feedback" style="margin-top:10px">${esc(txt)}</div>`;
  }catch(err){out.innerHTML=`<div class="notice bad" style="margin-top:10px">${esc(err.message)}</div>`}
  btn.disabled=false;btn.textContent="✨ Explain further";
}

function openSettings(){
  const s=getSettings(),root=$("#modalRoot");
  root.innerHTML=`<div class="modal-backdrop" id="settingsBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="row"><h2>Settings</h2><button class="btn small right" id="closeSettings">✕</button></div>
    <div class="field"><label>Anthropic API key</label><input id="apiKey" type="password" value="${esc(s.apiKey)}" placeholder="sk-ant-…">
      <div class="muted">Stored in this browser's localStorage. Used only for optional bank generation and “Explain further”.</div></div>
    <label class="check-row" style="margin-top:14px"><input type="checkbox" id="aiEnabled" ${s.aiEnabled?"checked":""}> Enable AI-assisted features</label>
    <div class="notice" style="margin-top:14px">Reading, manual authoring, JSON import, quizzes, and practice exams continue to work without an API key once a question bank exists.</div>
    <div class="row end" style="margin-top:18px"><button class="btn" id="cancelSettings">Cancel</button><button class="btn primary" id="saveSettings">Save settings</button></div>
  </div></div>`;
  $("#closeSettings").onclick=$("#cancelSettings").onclick=()=>root.innerHTML="";
  $("#settingsBackdrop").onclick=e=>{if(e.target.id==="settingsBackdrop")root.innerHTML=""};
  $("#saveSettings").onclick=()=>{saveSettings({apiKey:$("#apiKey").value.trim(),aiEnabled:$("#aiEnabled").checked});root.innerHTML="";if(state.view==="examResults")render()};
}

render();
</script>
